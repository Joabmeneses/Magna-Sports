<style>
html body.trx{--ink:#0c0716;--coal:#170d2c;--panel:#1d1236;--pur:#8b5cf6;--pur2:#6d3fe0;--lime:#c6ff1a;--paper:#f2f2ee;--mut:#b9aee0;--red:#ff3b30;--dots:radial-gradient(rgba(255,255,255,.12) 1.2px,transparent 1.4px) 0 0/22px 22px;--stripes:repeating-linear-gradient(-62deg,rgba(255,255,255,.05) 0 2px,transparent 2px 20px);background:var(--coal)!important;background-image:none!important;color:var(--paper);font-family:Archivo,system-ui,sans-serif}
html body.trx:before,html body.trx:after{display:none!important}
html body.trx .tr-w{max-width:1200px;margin:0 auto;padding:22px 16px 130px}

html body.trx .tr-h:before{content:"";position:absolute;inset:0;z-index:-2;background:var(--stripes),var(--dots),linear-gradient(115deg,var(--pur) 0 58%,var(--pur2) 58% 100%)}
html body.trx .tr-h:after{content:"EN VIVO";position:absolute;right:-1%;bottom:-18%;z-index:-1;font:italic 400 clamp(110px,18vw,250px)/1 "Archivo Black",sans-serif;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.12);white-space:nowrap}
html body.trx .tr-ey{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;background:var(--ink);color:#fff;font:700 12px/1 "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
html body.trx .tr-ey.on{background:var(--red)}html body.trx .tr-ey.on:before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:trP 1.2s infinite}@keyframes trP{50%{opacity:.25}}
html body.trx .tr-h h1{margin:16px 0 10px;font:italic 400 clamp(48px,9vw,110px)/.9 "Archivo Black",sans-serif;text-transform:uppercase;color:#fff;letter-spacing:-.02em;text-shadow:6px 6px 0 var(--ink)}html body.trx .tr-h h1 span{color:var(--lime)}

html body.trx .tr-in.off{border-top-color:var(--lime)}

html body.trx .tr-sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:46px 0 14px}
html body.trx .tr-sh h2{margin:0;font:400 clamp(28px,4.4vw,44px)/1 "Archivo Black",sans-serif;text-transform:uppercase;color:#fff}html body.trx .tr-sh h2 span{font-style:italic;color:var(--lime)}
html body.trx .tr-sh small{padding:7px 10px;background:var(--ink);font:700 11px "Space Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
html body.trx .tr-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}

html body.trx .tr-c:before{content:"";position:absolute;inset:0;z-index:-1;background:var(--dots)}
html body.trx .tr-c:hover,html body.trx .tr-c.on{transform:translate(-2px,-3px)}html body.trx .tr-c.on{box-shadow:0 0 0 3px var(--lime),6px 6px 0 var(--ink)}
html body.trx .tr-c .pl{position:absolute;right:10px;top:10px;padding:4px 8px;background:var(--ink);font:700 10px "Space Mono",monospace;letter-spacing:.08em;text-transform:uppercase}

html body.trx .tr-c .mt{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
