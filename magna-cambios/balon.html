<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a0d18"><link rel="apple-touch-icon" href="img/app/apple-touch.png?v=3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Magna">
<title>Magna Arena · Balón de Oro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Space+Mono:wght@400;700&family=Archivo+Black&display=swap"><link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="calle.css">
<style>
html body.bo2{--ink:#0c0716;--coal:#1a1033;--panel:#140b28;--pur:#8b5cf6;--pur2:#6d3fe0;--lime:#c6ff1a;--gold:#ffc400;--paper:#f2f2ee;--mut:#b9aee0;--red:#ff3b30;
  --dots:radial-gradient(rgba(255,255,255,.13) 1.2px,transparent 1.4px) 0 0/22px 22px;--stripes:repeating-linear-gradient(-62deg,rgba(255,255,255,.05) 0 2px,transparent 2px 20px);
  background:var(--coal)!important;background-image:none!important;color:var(--paper);font-family:Archivo,system-ui,sans-serif}
html body.bo2:before,html body.bo2:after{display:none!important}
html body.bo2 .bo-w{max-width:1300px;margin:0 auto;padding:22px 16px 130px}
html body.bo2 .mono{font:700 12px/1 "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
/* ---------- portada tipo marcador ---------- */
html body.bo2 .bo-hero{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;padding:0;background:var(--panel);border-bottom:4px solid var(--lime)}
html body.bo2 .bo-hero>div:first-child{padding:clamp(22px,4vw,40px)}
html body.bo2 .bo-hero:before{content:"";position:absolute;inset:0;z-index:-2;background:var(--stripes),var(--dots),linear-gradient(115deg,var(--pur) 0 58%,var(--pur2) 58% 100%)}
html body.bo2 .bo-hero:after{content:"BALÓN";position:absolute;right:-1%;bottom:-14%;z-index:-1;font:italic 400 clamp(120px,20vw,280px)/1 "Archivo Black",sans-serif;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.12);white-space:nowrap}
html body.bo2 .bo-ey{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
html body.bo2 .bo-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;background:var(--ink);color:var(--paper);font:700 12px/1 "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase;border-radius:0}
html body.bo2 .bo-chip.on{background:var(--red);color:#fff}
html body.bo2 .bo-chip.on:before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:boP 1.2s infinite}
@keyframes boP{50%{opacity:.25}}
html body.bo2 .bo-hero h1{margin:18px 0 12px;font:italic 400 clamp(52px,9.5vw,124px)/.88 "Archivo Black",Archivo,sans-serif;text-transform:uppercase;letter-spacing:-.02em;color:#fff;text-shadow:6px 6px 0 var(--ink)}
html body.bo2 .bo-hero h1 span{color:var(--lime)}
html body.bo2 .bo-hero p{margin:0;max-width:50ch;color:#ece6ff;font-size:16px;line-height:1.5}
html body.bo2 .bo-nums{display:flex;flex-wrap:wrap;gap:0;margin-top:22px;width:fit-content;max-width:100%;background:var(--ink);border:2px solid var(--ink)}
html body.bo2 .bo-n{padding:12px 18px;min-width:130px;background:var(--panel);border-top:4px solid var(--lime);border-radius:0}
html body.bo2 .bo-n+.bo-n{border-left:2px solid var(--ink)}
html body.bo2 .bo-n:nth-child(2){border-top-color:var(--gold)}html body.bo2 .bo-n:nth-child(3){border-top-color:#fff}
html body.bo2 .bo-n b{display:block;font:400 28px/1.05 "Archivo Black",sans-serif;color:#fff;white-space:nowrap}
html body.bo2 .bo-n span{font:700 10px "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
html body.bo2 .bo-cta{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:14px 22px;border:0;border-radius:0;background:var(--lime);color:var(--ink);font:700 13px "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:6px 6px 0 var(--ink);transition:transform .12s,box-shadow .12s}
html body.bo2 .bo-cta:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
html body.bo2 .bo-tro{align-self:center;height:clamp(200px,26vw,330px)!important;width:auto!important;margin-right:clamp(20px,4vw,50px);filter:drop-shadow(0 0 50px rgba(255,196,0,.65));-webkit-mask:radial-gradient(ellipse 50% 50% at 50% 50%,#000 68%,transparent 100%);mask:radial-gradient(ellipse 50% 50% at 50% 50%,#000 68%,transparent 100%);animation:boF 5s ease-in-out infinite}@keyframes boF{50%{transform:translateY(-10px)}}
/* ---------- títulos de sección ---------- */
html body.bo2 .bo-sc{margin-top:46px;scroll-margin-top:90px}
html body.bo2 .bo-sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 16px}
html body.bo2 .bo-sh h2{margin:0;font:400 clamp(30px,4.6vw,48px)/1 "Archivo Black",sans-serif;text-transform:uppercase;letter-spacing:-.01em;color:#fff}
html body.bo2 .bo-sh h2 span{font-style:italic;color:var(--lime)}
html body.bo2 .bo-sh small{display:inline-block;padding:7px 10px;background:var(--ink);color:var(--paper);font:700 11px "Space Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
html body.bo2 .bo-note{margin:0 0 16px;color:var(--mut);font-size:14px}
/* ---------- nominados 1x3 ---------- */
html body.bo2 .bo-nom{--n:3;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px}
html body.bo2 .bo-c{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:30px 16px 16px;border-radius:0;background:var(--panel);border-top:6px solid var(--tc,var(--pur));box-shadow:6px 6px 0 var(--ink);animation:boIn .4s both;transition:transform .12s,box-shadow .12s}
html body.bo2 .bo-c:before{content:"";position:absolute;inset:0;z-index:-1;background:var(--dots),linear-gradient(180deg,color-mix(in srgb,var(--tc,var(--pur)) 38%,transparent),transparent 62%)}
html body.bo2 .bo-c:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
@keyframes boIn{from{opacity:0;transform:translateY(14px)}}
html body.bo2 .bo-c.mine{box-shadow:0 0 0 3px var(--lime),8px 8px 0 var(--ink)}
html body.bo2 .bo-c .tav{margin-bottom:8px;box-shadow:6px 6px 0 var(--ink);border-radius:50%}
html body.bo2 .bo-c>b{font:400 clamp(20px,2.4vw,28px)/1.05 "Archivo Black",sans-serif;text-transform:uppercase;color:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html body.bo2 .bo-c>b a{color:inherit;text-decoration:none}
html body.bo2 .bo-tm{display:inline-flex;align-items:center;gap:6px;font:700 11px "Space Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
html body.bo2 .bo-ss{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin:12px 0 4px;background:var(--ink);border:2px solid var(--ink)}
html body.bo2 .bo-ss>div{padding:10px 4px;background:rgba(12,7,22,.55)}html body.bo2 .bo-ss>div+div{border-left:2px solid var(--ink)}
html body.bo2 .bo-ss b{display:block;font:400 22px/1.05 "Archivo Black",sans-serif;color:#fff}
html body.bo2 .bo-ss span{font:700 9px "Space Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
html body.bo2 .bo-bal{display:inline-block;padding:5px 9px;background:var(--gold);color:var(--ink);font:700 10px "Space Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
html body.bo2 .bo-v{width:100%;margin-top:auto;padding:13px 10px;border:0;border-radius:999px;background:var(--paper);color:var(--ink);font:700 13px "Space Mono",monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .12s}
html body.bo2 .bo-c>.bo-v{margin-top:auto}html body.bo2 .bo-c>:nth-last-child(2){margin-bottom:12px}
html body.bo2 .bo-v:hover:not(:disabled){transform:translate(-2px,-2px);background:var(--lime)}
html body.bo2 .bo-c.mine .bo-v{background:var(--lime);color:var(--ink)}
html body.bo2 .bo-v:disabled{cursor:default}html body.bo2 .bo-c:not(.mine) .bo-v:disabled{opacity:.5}
html body.bo2 .bo-ft{margin:16px 0 0;font-size:14px;color:var(--mut)}html body.bo2 .bo-ft a{color:var(--lime)}
html body.bo2 .bo-tt{display:flex;flex-direction:column;align-items:stretch;gap:5px;width:100%;margin:4px 0 6px}
html body.bo2 .bo-tt .k{font:700 9px "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
html body.bo2 .bo-tt .t{padding:7px 10px;background:var(--gold);color:var(--ink);font:400 12px/1.2 "Archivo Black",sans-serif;text-transform:uppercase;box-shadow:3px 3px 0 var(--ink)}
html body.bo2 .bo-tt .e{padding:7px 10px;border:2px dashed rgba(255,255,255,.18);font:700 10px "Space Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
/* ---------- palmarés ---------- */
html body.bo2 .bo-champ{position:relative;isolation:isolate;display:flex;align-items:center;gap:22px;padding:22px 24px;border-radius:0;background:var(--panel);border-left:8px solid var(--gold);box-shadow:6px 6px 0 var(--ink)}
html body.bo2 .bo-champ:before{content:"";position:absolute;inset:0;z-index:-1;background:var(--stripes),linear-gradient(100deg,rgba(255,196,0,.28),transparent 60%)}
html body.bo2 .bo-champ .tav{box-shadow:6px 6px 0 var(--ink);border-radius:50%}
html body.bo2 .bo-champ .k{display:inline-block;padding:6px 9px;background:var(--gold);color:var(--ink);font:700 10px "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
html body.bo2 .bo-champ b{display:block;margin:8px 0 2px;font:italic 400 clamp(28px,4.4vw,44px)/1 "Archivo Black",sans-serif;text-transform:uppercase;color:#fff}
html body.bo2 .bo-champ b a,html body.bo2 .bo-r b a{color:inherit;text-decoration:none}
html body.bo2 .bo-champ small{font:700 11px "Space Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
html body.bo2 .bo-pod{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
html body.bo2 .bo-pod span{padding:6px 10px;background:var(--ink);font:700 11px "Space Mono",monospace;text-transform:uppercase}
html body.bo2 .bo-list{display:flex;flex-direction:column;margin-top:14px;background:var(--panel);border:2px solid var(--ink)}
html body.bo2 .bo-r{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:0;background:transparent}
html body.bo2 .bo-r+.bo-r{border-top:2px solid var(--ink)}
html body.bo2 .bo-ed{flex:none;width:58px;text-align:center}
html body.bo2 .bo-ed b{display:block;font:italic 400 24px/1 "Archivo Black",sans-serif;color:var(--lime)}
html body.bo2 .bo-ed small{font:700 9px "Space Mono",monospace;letter-spacing:.12em;color:var(--mut)}
html body.bo2 .bo-r>div:nth-child(3){flex:1;min-width:0}
html body.bo2 .bo-r b{display:block;font:400 16px "Archivo Black",sans-serif;text-transform:uppercase}
html body.bo2 .bo-r small{font:700 10px "Space Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
html body.bo2 .bo-e{padding:22px;background:var(--panel);border:2px dashed rgba(255,255,255,.2);color:var(--mut);text-align:center;font:700 12px "Space Mono",monospace;text-transform:uppercase;letter-spacing:.1em}
html body.bo2 .bo-most{display:flex;flex-wrap:wrap;gap:10px}
html body.bo2 .bo-most span{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;background:var(--panel);box-shadow:4px 4px 0 var(--ink);font:400 14px "Archivo Black",sans-serif;text-transform:uppercase}
html body.bo2 .bo-most em{font:700 12px "Space Mono",monospace;font-style:normal;color:var(--gold)}
html body.bo2 .bo-toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:300;padding:12px 18px;background:var(--lime);color:var(--ink);font:700 13px "Space Mono",monospace;letter-spacing:.1em;text-transform:uppercase;box-shadow:6px 6px 0 var(--ink);max-width:calc(100vw - 24px)}
html body.bo2 .bo-toast.bad{background:var(--red);color:#fff}
@media(max-width:700px){html body.bo2 .bo-hero{grid-template-columns:1fr}html body.bo2 .bo-tro{position:absolute;right:-30px;top:10px;width:150px;margin:0;opacity:.5;z-index:-1}
  html body.bo2 .bo-n{min-width:0;flex:1;padding:10px 12px}html body.bo2 .bo-n b{font-size:20px}html body.bo2 .bo-nums{width:100%}
  html body.bo2 .bo-nom{gap:8px}html body.bo2 .bo-c{padding:18px 6px 10px;box-shadow:4px 4px 0 var(--ink);border-top-width:4px}html body.bo2 .bo-c .tav{--s:62px!important;box-shadow:4px 4px 0 var(--ink)}html body.bo2 .bo-c>b{font-size:14px}
  html body.bo2 .bo-tm{font-size:9px;letter-spacing:.04em}html body.bo2 .bo-tm .cr{display:none}html body.bo2 .bo-ss b{font-size:15px}html body.bo2 .bo-ss span{font-size:7.5px;letter-spacing:0}html body.bo2 .bo-ss>div{padding:7px 1px}
  html body.bo2 .bo-bal{font-size:8px;padding:4px 5px}html body.bo2 .bo-tt .t{font-size:9px;padding:5px 4px}html body.bo2 .bo-tt .e{font-size:8px;padding:5px 3px;letter-spacing:0}html body.bo2 .bo-tt .k{font-size:7.5px;letter-spacing:.06em}html body.bo2 .bo-v{padding:10px 2px;font-size:10px;letter-spacing:.06em}
  html body.bo2 .bo-champ{flex-direction:column;text-align:center;border-left:0;border-top:8px solid var(--gold)}html body.bo2 .bo-pod{justify-content:center}}
@media(prefers-reduced-motion:reduce){html body.bo2 *{animation:none!important}}
</style></head>
