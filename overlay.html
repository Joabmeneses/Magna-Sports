<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magna Arena · Marcador para transmisión</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Space+Mono:wght@400;700&family=Archivo+Black&family=Permanent+Marker&family=Lilita+One&display=swap">
<style>
/* Marcador para OBS: fondo transparente, pensado para 1920x1080 (todo escala con vw). */
body>*:not(#ov):not(#fs):not(#gl):not(#tw):not(#lg):not(#rw):not(#mx):not(#omx):not(#ad):not(#chx):not(#cst):not(#msg):not(script){display:none!important}
html,body{margin:0;background:transparent!important;overflow:hidden;width:100vw;height:56.25vw;font-family:Archivo,sans-serif;color:#fff}
body.demo{background:#000 var(--demo) center/cover no-repeat!important}
:root{--ink:#0c0716;--pur:#8b5cf6;--pur2:#6d3fe0;--lime:#c6ff1a;--red:#ff3b30;--stripes:repeating-linear-gradient(-62deg,rgba(255,255,255,.07) 0 .12vw,transparent .12vw 1vw)}
.ov{position:fixed;left:50%;bottom:1.6vw;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;filter:drop-shadow(.35vw .35vw 0 rgba(12,7,22,.85));transition:transform .5s cubic-bezier(.2,1.2,.4,1),opacity .4s}
.ov.hide{transform:translate(-50%,140%);opacity:0}
.ov-tag{display:flex;align-items:stretch;margin-bottom:-.1vw}
.ov-tag span{padding:.35vw .8vw;background:var(--ink);font:700 .78vw/1 "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.ov-tag .lv{background:var(--red)}.ov-tag .lv:before{content:"";display:inline-block;width:.5vw;height:.5vw;margin-right:.45vw;border-radius:50%;background:#fff;vertical-align:middle;animation:p 1.2s infinite}@keyframes p{50%{opacity:.25}}
.ov-tag .ck{background:var(--lime);color:var(--ink)}
.ov-bar{display:grid;grid-template-columns:22vw auto 22vw;align-items:stretch;height:4.4vw}
.ov-t{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:.9vw;padding:0 1.2vw;background:var(--tc,var(--pur))}
.ov-t:before{content:"";position:absolute;inset:0;z-index:-1;background:var(--stripes),linear-gradient(90deg,rgba(12,7,22,.35),transparent 60%)}
.ov-t.h{clip-path:polygon(1.4vw 0,100% 0,100% 100%,0 100%)}.ov-t.a{flex-direction:row-reverse;clip-path:polygon(0 0,100% 0,calc(100% - 1.4vw) 100%,0 100%)}
.ov-t.a:before{background:var(--stripes),linear-gradient(270deg,rgba(12,7,22,.35),transparent 60%)}
.ov-cr{flex:none;width:3.1vw;height:3.1vw;border-radius:50%;background:var(--ink) center/cover;box-shadow:0 0 0 .22vw var(--ink);display:grid;place-items:center;font:400 1vw "Archivo Black",sans-serif}
.ov-nm{min-width:0;font:400 1.75vw/1 "Archivo Black",sans-serif;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:.2vw .2vw 0 rgba(12,7,22,.6)}
.ov-sc{display:flex;align-items:center;background:var(--ink)}
.ov-n{display:grid;place-items:center;min-width:4.6vw;height:100%;font:italic 400 3vw/1 "Archivo Black",sans-serif}
.ov-n.bump{animation:bump .9s}@keyframes bump{20%{transform:scale(1.5);color:var(--lime)}}
.ov-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35vw;padding:0 .6vw;min-width:5vw}
.ov-mid b{font:700 .8vw/1 "Space Mono",monospace;letter-spacing:.1em;color:var(--lime)}
.ov-pips{display:flex;gap:.3vw}.ov-pips i{width:.7vw;height:.7vw;border:.12vw solid #6b6290;transform:rotate(45deg)}.ov-pips i.h{background:var(--hc);border-color:var(--hc)}.ov-pips i.a{background:var(--ac);border-color:var(--ac)}
.ov-low{display:flex;align-items:stretch;min-width:30vw;max-width:66vw;height:2.1vw;background:var(--lime);color:var(--ink);overflow:hidden}
.ov-low em{display:grid;place-items:center;padding:0 .9vw;background:var(--ink);color:var(--lime);font:italic 400 .95vw "Archivo Black",sans-serif;font-style:normal;white-space:nowrap}
.ov-low span{flex:1;display:flex;align-items:center;padding:0 1vw;font:400 1vw "Archivo Black",sans-serif;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:in .5s}
@keyframes in{from{transform:translateY(100%);opacity:0}}
/* estilo "arriba": copia exacta de la barra de torneo (morado / lima); el centro se recorta para el reloj del juego */
:root{--sy:1.39vw;--bk:#0c0716;--L:#8b5cf6;--Ld:#6d3fe0;--R:#c6ff1a;--Rd:#9fd400}
.ov.top{bottom:auto;top:var(--sy);filter:none}
.ov.top.hide{transform:translate(-50%,-260%)}
.sb{position:relative;width:38vw;height:3.8vw;font-family:"Lilita One","Archivo Black",sans-serif}
.sb-bar{position:absolute;top:0;bottom:0;left:calc(50% - 16.67vw);width:33.34vw;background:linear-gradient(90deg,var(--L) 0 50%,var(--R) 50% 100%);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.sb-bar:before{content:"";position:absolute;inset:0;border:.2vw solid var(--bk);background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 35%,transparent 70%,rgba(0,0,0,.18))}
.sb-bar.flh,.sb-bar.fla{animation:flh .5s 3}@keyframes flh{50%{filter:brightness(1.35)}}
.sb-nm{position:absolute;top:0;height:3.8vw;width:5.9vw;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:400}
.sb-nm span{font-size:1.75vw;line-height:1;white-space:nowrap;letter-spacing:.02em}
.sb-nm.h{left:calc(50% - 13.7vw);color:#fff;text-shadow:0 .12vw 0 rgba(12,7,22,.45)}.sb-nm.a{left:calc(50% + 7.8vw);color:var(--bk)}
.sb-n{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:3.35vw;line-height:1;font-weight:400}
.sb-n.h{left:calc(50% - 6.7vw);color:#fff;text-shadow:0 .14vw 0 rgba(12,7,22,.45)}.sb-n.a{left:calc(50% + 6.7vw);color:var(--bk)}
.sb-n.bump{animation:bumpY .9s}@keyframes bumpY{20%{transform:translate(-50%,-50%) scale(1.45)}}
.sb-tab{position:absolute;top:3.75vw;height:1.15vw;width:8.4vw;display:flex;justify-content:center;align-items:flex-start;gap:.65vw;padding-top:.42vw;box-sizing:border-box;background:var(--bk);clip-path:polygon(0 0,100% 0,calc(100% - .6vw) 100%,.6vw 100%)}
.sb-tab.h{left:calc(50% - 14.15vw)}.sb-tab.a{left:calc(50% + 5.75vw)}
.sb-tab i{width:2.8vw;height:.38vw;border-radius:.1vw;background:#4a4260}.sb-tab.x3 i{width:2vw}
.sb-tab.h i.on{background:#fff}.sb-tab.a i.on{background:var(--R)}
.sb-lo{position:absolute;top:50%;width:4.9vw;height:4.6vw;transform:translate(-50%,-50%);background:center/contain no-repeat;filter:drop-shadow(0 .12vw .15vw rgba(0,0,0,.55))}
.sb-lo.h{left:calc(50% - 16.3vw)}.sb-lo.a{left:calc(50% + 16.5vw)}
.sb-lo.ini{display:grid;place-items:center}
.sb-lo.ini b{display:grid;place-items:center;width:3.5vw;height:3.5vw;border:.22vw solid var(--bk);font-size:1.6vw;font-weight:400;transform:rotate(-12deg)}
.sb-lo.h.ini b{background:var(--L);color:#fff}.sb-lo.a.ini b{background:var(--R);color:var(--bk)}
/* temas de la barra: &tema=3 negra con acentos (por defecto) · 1 morado vs negro · 2 dos morados */
.sb-lo.ini b{border-radius:50%;transform:none;width:3.6vw;height:3.6vw;border:.25vw solid #fff;box-shadow:0 .2vw .4vw rgba(0,0,0,.5)}
.sb-lo.h.ini b{background:#6d3fe0;color:#fff}.sb-lo.a.ini b{background:#1d1236;color:var(--R);border-color:var(--R)}
.t1 .sb-bar{background:linear-gradient(90deg,#7c4dff 0,#6d3fe0 50%,#241042 50%,#160a2b 100%)}
.t1 .sb-bar:after{content:"";position:absolute;left:0;right:0;bottom:.2vw;height:.25vw;background:linear-gradient(90deg,var(--L) 0 50%,var(--R) 50%)}
.t1 .sb-nm.a,.t1 .sb-n.a{color:#fff}.t1 .sb-n.a{color:var(--R)}
.t2 .sb-bar{background:linear-gradient(90deg,#8b5cf6 0 50%,#4c1d95 50% 100%)}.t2 .sb-bar:before{border-color:#0c0716}
.t2 .sb-nm.a,.t2 .sb-n.a{color:#fff}.t2 .sb-n{color:var(--R)!important;text-shadow:0 .14vw 0 rgba(12,7,22,.6)}
.t3 .sb-bar{background:linear-gradient(90deg,#0c0716 0,#0c0716 calc(50% - 8.6vw),var(--L) calc(50% - 8.6vw) 50%,var(--R) 50% calc(50% + 8.6vw),#0c0716 calc(50% + 8.6vw))}
.t3 .sb-bar:before{border-color:#2a1b47}
.t3 .sb-nm.h,.t3 .sb-nm.a{color:#fff}.t3 .sb-n.h{color:#fff}.t3 .sb-n.a{color:#0c0716;text-shadow:none}
.t3 .sb-tab.a i.on{background:var(--R)}
/* gol: cartel que cae debajo del lado que anotó */
body.top .gl{left:auto;bottom:auto;top:calc(var(--sy) + 5.4vw);transform:none;flex-direction:column;align-items:center;gap:.2vw;padding:.5vw 1.6vw .7vw;background:var(--bk);border-bottom:.35vw solid var(--gc);clip-path:polygon(0 0,100% 0,calc(100% - .8vw) 100%,.8vw 100%);box-shadow:none;opacity:0;text-align:center}
body.top .gl.h{right:calc(50% + 5.2vw)}body.top .gl.a{left:calc(50% + 5.2vw)}
body.top .gl.go{animation:glT 3.2s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes glT{0%{opacity:0;transform:translateY(-2vw) scale(.6)}10%{opacity:1;transform:translateY(0) scale(1.08)}16%,86%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-1.5vw)}}
body.top .gl b{font:400 3vw/1 "Permanent Marker","Archivo Black",cursive;color:var(--gc);text-shadow:.15vw .15vw 0 rgba(0,0,0,.6);transform:rotate(-5deg)}
body.top .gl span{margin:0;font:400 1.15vw/1 "Lilita One","Archivo Black",sans-serif;color:#fff;text-transform:uppercase}body.top .gl small{font:700 .75vw "Space Mono",monospace;letter-spacing:.12em;color:#b9aee0;text-transform:uppercase}
body.top .gl .ov-cr{width:2.6vw;height:2.6vw;font-size:.8vw;border-radius:0;box-shadow:none;background-color:transparent;background-size:contain;background-repeat:no-repeat}
/* set ganado: pantalla tipo "GAME WINNER" */
.rw{position:fixed;inset:0;z-index:25;overflow:hidden;pointer-events:none;opacity:0;background:radial-gradient(60vw 40vw at 50% 50%,#1d1430,#07040d 80%);--gc:var(--pur)}
.rw:before{content:"";position:absolute;inset:0;opacity:.5;background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px) 0 0/.5vw .5vw,radial-gradient(rgba(255,255,255,.04) 1px,transparent 1.6px) .25vw .3vw/.9vw .9vw}
.rw.on{animation:rwIn .35s ease-out forwards}.rw.off{opacity:1;animation:rwOut .45s ease-in forwards}
@keyframes rwIn{0%{opacity:0;filter:brightness(3)}100%{opacity:1;filter:none}}@keyframes rwOut{to{opacity:0;transform:scale(1.08)}}
.rw svg{position:absolute;inset:0;width:100%;height:100%}
.rw svg path{fill:none;stroke:var(--gc);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--gc)) drop-shadow(0 0 14px var(--gc));stroke-dasharray:2200;stroke-dashoffset:2200;opacity:.9}
.rw.on svg path{animation:zap 1.1s ease-out forwards,flick 1.6s steps(2) .9s infinite}.rw.on svg path:nth-child(2){animation-delay:.12s,1s}.rw.on svg path:nth-child(3){animation-delay:.22s,1.1s}.rw.on svg path:nth-child(4){animation-delay:.3s,1.2s}.rw.on svg path:nth-child(5){animation-delay:.38s,1.3s}
@keyframes zap{to{stroke-dashoffset:0}}@keyframes flick{50%{opacity:.55}}
.rw .col{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.rw.on .col{animation:colUp 4s linear forwards}@keyframes colUp{from{transform:translate(-50%,0)}to{transform:translate(-50%,-14vw)}}
.rw .col span{font:400 6vw/1.3 "Space Mono",monospace;letter-spacing:.55em;margin-right:-.55em;color:#fff;text-shadow:0 0 1vw rgba(255,255,255,.25);white-space:nowrap}
.rw .col span:nth-child(odd){opacity:.92}
.rw .hit{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-8deg);text-align:center}
.rw .hit i{display:inline-block;margin-bottom:.8vw;padding:.45vw 1.1vw;background:#fff;color:#07040d;font:700 1.3vw/1 "Space Mono",monospace;font-style:normal;letter-spacing:.16em;text-transform:uppercase;transform:rotate(3deg)}
.rw .hit b{display:block;max-width:94vw;overflow:hidden;text-overflow:ellipsis;font:400 14vw/1.05 "Permanent Marker","Archivo Black",cursive;color:var(--gc);text-transform:uppercase;text-shadow:.15vw .15vw 0 #07040d,-.15vw -.15vw 0 #07040d,.6vw .6vw 0 rgba(0,0,0,.6),0 0 4vw rgba(0,0,0,.8);white-space:nowrap}
.rw .who.nx{background:#fff}
.rw.on .hit{animation:slam .55s cubic-bezier(.2,1.6,.4,1) .25s both}
@keyframes slam{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(2.6)}60%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
.rw.on .shk{animation:shk .35s .72s}@keyframes shk{20%{transform:translate(.6vw,-.4vw)}40%{transform:translate(-.5vw,.5vw)}60%{transform:translate(.4vw,.3vw)}80%{transform:translate(-.3vw,-.2vw)}}
.rw .shk{position:absolute;inset:0}
.rw .who{position:absolute;left:50%;bottom:7vw;transform:translateX(-50%);display:flex;align-items:center;gap:1.2vw;padding:.8vw 1.8vw .8vw 1vw;background:var(--lime);color:var(--ink);box-shadow:.5vw .5vw 0 rgba(0,0,0,.6);clip-path:polygon(1vw 0,100% 0,calc(100% - 1vw) 100%,0 100%);opacity:0}
.rw.on .who{animation:whoIn .5s cubic-bezier(.2,1.3,.4,1) .85s forwards}@keyframes whoIn{from{opacity:0;transform:translate(-50%,2vw)}to{opacity:1;transform:translateX(-50%)}}
.rw .who .ov-cr{width:4.2vw;height:4.2vw;font-size:1.3vw;color:#fff;background-color:var(--gc);box-shadow:0 0 0 .25vw var(--ink)}
.rw .who b{display:block;font:400 2.6vw/1 "Archivo Black",sans-serif;text-transform:uppercase}.rw .who small{display:block;margin-top:.35vw;font:700 .95vw "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
/* pantalla completa: antes de empezar, entretiempo y final */
.fs{position:fixed;inset:0;display:grid;place-items:center;background:var(--stripes),linear-gradient(115deg,var(--pur) 0 55%,var(--pur2) 55%);opacity:0;pointer-events:none;transition:opacity .6s}
.fs.on{opacity:1}
.fs-in{display:flex;flex-direction:column;align-items:center;gap:1.6vw;text-align:center}
.fs-k{padding:.6vw 1.2vw;background:var(--red);font:700 1.2vw/1 "Space Mono",monospace;letter-spacing:.16em;text-transform:uppercase}
.fs-k.n{background:var(--ink)}
.fs-vs{display:grid;grid-template-columns:30vw auto 30vw;align-items:center;gap:2vw}
.fs-t{display:flex;flex-direction:column;align-items:center;gap:1vw}
.fs-t .ov-cr{width:12vw;height:12vw;font-size:4vw;box-shadow:0 0 0 .5vw var(--ink),.8vw .8vw 0 .5vw var(--ink)}
.fs-t b{font:400 3.6vw/1 "Archivo Black",sans-serif;text-transform:uppercase;text-shadow:.35vw .35vw 0 var(--ink)}
.fs-c{font:italic 400 7vw/1 "Archivo Black",sans-serif;color:var(--lime);text-shadow:.5vw .5vw 0 var(--ink)}
.fs-sub{font:400 1.6vw "Archivo Black",sans-serif;text-transform:uppercase}
.fs-wm{position:absolute;right:-1vw;bottom:-3vw;font:italic 400 18vw/1 "Archivo Black",sans-serif;color:transparent;-webkit-text-stroke:.15vw rgba(255,255,255,.12);white-space:nowrap;pointer-events:none}
.fs-logo{position:absolute;left:2vw;top:2vw;font:400 1.6vw "Archivo Black",sans-serif;letter-spacing:.02em}.fs-logo span{color:var(--lime)}
/* pantallas completas con la misma estética oscura (azul vs rojo) */
.fs{background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px) 0 0/.5vw .5vw,radial-gradient(45vw 45vw at 0 50%,rgba(139,92,246,.65),transparent 70%),radial-gradient(45vw 45vw at 100% 50%,rgba(198,255,26,.45),transparent 70%),#0a0710}
.fs-t .ov-cr{border-radius:0;background-color:#15121c;background-size:70%;background-repeat:no-repeat;box-shadow:0 .6vw 0 var(--sc),.6vw 1.2vw 0 rgba(0,0,0,.5)}
.fs-t:first-child{--sc:#8b5cf6}.fs-t:last-child{--sc:#c6ff1a}
.fs-t b{text-shadow:none;font-family:Archivo,sans-serif;font-weight:900;font-stretch:115%}
.fs-c{font-family:"Permanent Marker","Archivo Black",cursive;font-style:normal;color:#fff;transform:rotate(-6deg);text-shadow:.4vw .4vw 0 rgba(0,0,0,.6)}
.fs-k{background:#fff;color:#0a0710}.fs-k.n{background:#c6ff1a;color:#0c0716}
.fs.on .fs-t:first-child{animation:fsL .7s cubic-bezier(.2,1.2,.4,1) both}.fs.on .fs-t:last-child{animation:fsR .7s cubic-bezier(.2,1.2,.4,1) both}.fs.on .fs-c{animation:slamC .6s cubic-bezier(.2,1.6,.4,1) .35s both}
@keyframes fsL{from{opacity:0;transform:translateX(-12vw)}}@keyframes fsR{from{opacity:0;transform:translateX(12vw)}}@keyframes slamC{from{opacity:0;transform:rotate(-6deg) scale(2.4)}}
/* portada (antes de empezar, entretiempo y final): la imagen de la comunidad con escudos en los círculos */
.fs.pt{background:#0c0716 url(img/portada.webp) center/100% 100% no-repeat}
.fs.pt .fs-logo,.fs.pt .fs-wm{display:none}
.pt-in{position:absolute;inset:0;font-family:"Lilita One","Archivo Black",sans-serif}
.pt-cr{position:absolute;top:36.3vw;width:15vw;height:15vw;transform:translate(-50%,-50%);background:center/contain no-repeat;display:grid;place-items:center;filter:drop-shadow(0 .3vw .6vw rgba(0,0,0,.6))}
.pt-cr.h{left:23.4vw}.pt-cr.a{left:78.4vw}
.pt-cr b{font-size:6vw;font-weight:400;color:#fff;text-shadow:.3vw .3vw 0 rgba(0,0,0,.5)}
.pt-nm{position:absolute;top:48.1vw;width:20vw;height:4.4vw;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pt-nm.h{left:23.4vw}.pt-nm.a{left:78.5vw}
.pt-nm span{font-size:3vw;font-weight:400;line-height:1;white-space:nowrap;color:#fff;letter-spacing:.02em}
.pt-nm.h span{text-shadow:0 0 1.2vw rgba(139,92,246,.9)}.pt-nm.a span{text-shadow:0 0 1.2vw rgba(255,170,0,.9)}
.pt-k{position:absolute;left:50%;top:15vw;transform:translateX(-50%) rotate(-3deg);padding:.6vw 1.4vw;background:#0c0716;color:#fff;font:700 1.25vw/1 "Space Mono",monospace;letter-spacing:.18em;text-transform:uppercase;box-shadow:.3vw .3vw 0 #c6ff1a;white-space:nowrap}
.pt-sc{position:absolute;left:51.4vw;top:33.5vw;transform:translate(-50%,-50%) rotate(-6deg);display:flex;align-items:center;gap:1.2vw;padding:.8vw 2.2vw;background:#0c0716;border:.35vw solid #ffc21a;box-shadow:.6vw .6vw 0 rgba(0,0,0,.5)}
.pt-sc b{font:400 7vw/1 "Lilita One","Archivo Black",sans-serif;color:#fff}.pt-sc i{font:400 4vw/1 "Lilita One",sans-serif;font-style:normal;color:#ffc21a}
.pt-sub{position:absolute;left:50%;bottom:2.4vw;transform:translateX(-50%);padding:.5vw 1.2vw;background:rgba(12,7,22,.85);color:#fff;font:700 1vw/1 "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.fs.on .pt-cr{animation:ptPop .6s cubic-bezier(.2,1.5,.4,1) .25s both}.fs.on .pt-cr.a{animation-delay:.4s}
.fs.on .pt-nm{animation:ptUp .5s ease-out .5s both}.fs.on .pt-sc{animation:ptSlam .55s cubic-bezier(.2,1.6,.4,1) .3s both}
@keyframes ptPop{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}}@keyframes ptUp{from{opacity:0;transform:translate(-50%,0)}}@keyframes ptSlam{from{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(2.2)}}
/* presentación de jugadores */
.fs.pjv{background:#0c0716}
.fs.pjv:before{content:"";position:absolute;inset:-2vw;background:url(img/portada.webp) center/cover;filter:blur(1.4vw) brightness(.35) saturate(1.4)}
