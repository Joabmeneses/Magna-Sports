<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magna Arena · Noticias</title>
<meta name="description" content="Noticias de la comunidad Magna Sports: ligas, torneos, fichajes, resultados y comunicados oficiales.">
<meta property="og:title" content="Noticias · Magna Arena"><meta property="og:description" content="Lo último de la comunidad Magna Sports."><meta property="og:image" content="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@500;700&display=swap"><link rel="stylesheet" href="site.css">
<style>
.nhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ncreate{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;border:0;border-radius:999px;padding:12px 20px;font:700 15px Archivo,sans-serif;text-decoration:none;box-shadow:0 10px 30px rgba(255,90,54,.3)}
.ncreate[hidden]{display:none}
.sec-t{display:flex;align-items:center;gap:10px;margin:40px 0 14px}.sec-t h2{margin:0}.sec-t:before{content:"";width:6px;height:26px;border-radius:3px;background:linear-gradient(var(--orange),var(--purple))}
/* destacadas */
.feat{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.feat .side{display:grid;gap:16px}
@media(max-width:900px){.feat{grid-template-columns:1fr}}
.fc{position:relative;display:block;border-radius:28px;overflow:hidden;min-height:220px;background:#141a33;border:1px solid var(--line);color:#fff;text-decoration:none;cursor:pointer;isolation:isolate;animation:up .5s both;text-align:left;font:inherit;padding:0;width:100%}
.fc.big{min-height:clamp(320px,46vw,520px)}
.fc img,.fc .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.fc:hover img{transform:scale(1.04)}
.fc:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,13,24,0) 25%,rgba(10,13,24,.55) 55%,rgba(10,13,24,.96))}
.fc .in{position:absolute;left:0;right:0;bottom:0;padding:clamp(16px,3vw,30px)}
.fc h3{margin:10px 0 8px;font-size:clamp(20px,2.4vw,26px);line-height:1.12;font-stretch:115%;text-transform:uppercase;font-weight:900}
.fc.big h3{font-size:clamp(26px,4.4vw,48px)}
.fc p{margin:0 0 12px;color:#d6d9ea;max-width:62ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc .star{position:absolute;top:16px;left:16px;background:var(--yellow);color:#0a0d18;border-radius:999px;padding:6px 12px;font:700 11px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.chipc{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font:700 12px Archivo,sans-serif;background:var(--c);color:#0a0d18}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.fc .meta{color:#c9cde0}
.bg{background:radial-gradient(70% 80% at 75% 40%,color-mix(in srgb,var(--c) 70%,transparent),transparent 70%),linear-gradient(135deg,#1b2260,#0a0d18)}
/* filtros */
.ftr{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:thin}.ftr .chip{flex:none;margin:0}
.ftr .chip i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:8px}
.ftr .chip b{margin-left:6px;color:var(--muted);font-weight:600}
.srch{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 10px}
/* tarjetas */
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;margin-top:10px}
.nc{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;animation:up .45s both;transition:transform .2s,border-color .2s}
.nc:hover{transform:translateY(-4px);border-color:var(--purple)}
.nc .im{position:relative;aspect-ratio:16/9;background:#141a33;overflow:hidden;cursor:pointer;display:block;border:0;padding:0;width:100%}
.nc .im img,.nc .im .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.nc:hover .im img{transform:scale(1.05)}
.nc .im .chipc{position:absolute;left:12px;top:12px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.nc .bd{display:flex;flex-direction:column;gap:10px;padding:16px 18px 18px;flex:1}
.nc h3{margin:0;font-size:19px;line-height:1.22}
.nc h3 button{all:unset;cursor:pointer}.nc h3 button:hover{color:var(--orange)}
.nc p{margin:0;color:#c3c7da;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nc .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.rd{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--orange);color:var(--orange);border-radius:999px;padding:9px 16px;font:700 13px Archivo,sans-serif;cursor:pointer;transition:background-color .15s,color .15s}
.rd:hover{background:var(--orange);color:#fff}.rd[hidden]{display:none}.rd{white-space:nowrap}
.shb{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;display:grid;place-items:center}.shb:hover{border-color:var(--purple)}.shb svg{width:18px;height:18px}
.rsum{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}.rsum span{display:inline-flex;margin-right:-4px}.rsum span em{font-style:normal;width:24px;height:24px;border-radius:50%;background:#1b2140;border:2px solid var(--card);display:grid;place-items:center;font-size:12px;margin-left:-6px}
.rsum span em:first-child{margin-left:0}
.more{display:flex;justify-content:center;margin:24px 0}
.empty2{background:var(--card);border:1px dashed var(--line);border-radius:24px;padding:46px 20px;text-align:center;color:var(--muted)}.empty2 b{display:block;color:var(--fg);font-size:20px;margin-bottom:6px}
.skel{border-radius:24px;background:linear-gradient(90deg,#11162c,#1a2040,#11162c);background-size:200% 100%;animation:sk 1.2s infinite;min-height:300px}@keyframes sk{to{background-position:-200% 0}}
/* lector */
.rov{position:fixed;inset:0;z-index:90;background:rgba(5,7,14,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow-y:auto;padding:clamp(0px,3vw,32px) 0;opacity:0;transition:opacity .25s}
.rov.show{opacity:1}
.art{position:relative;max-width:820px;margin:0 auto;background:var(--card2);border:1px solid var(--line);border-radius:clamp(0px,3vw,30px);overflow:hidden;transform:translateY(20px);transition:transform .3s cubic-bezier(.2,.9,.2,1)}
.rov.show .art{transform:none}
.art .cov{position:relative;aspect-ratio:16/9;background:#141a33}.art .cov img,.art .cov .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art .x{position:absolute;top:14px;right:14px;z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(10,13,24,.7);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center}
.art .ab{padding:clamp(18px,4vw,40px)}
.art h1{font-size:clamp(28px,5vw,46px);line-height:1.05;margin:14px 0 12px;font-stretch:118%;text-transform:uppercase;font-weight:900}
.art .lead{font-size:clamp(17px,2.2vw,20px);color:#dfe2f0;margin:0 0 20px;line-height:1.5}
.art .body{font-size:17px;line-height:1.75;color:#d2d6e8}.art .body p{margin:0 0 1.05em}.art .body h2{font-size:24px;margin:1.6em 0 .5em;color:#fff;font-stretch:115%}
.art .body strong{color:#fff}.art .body a{color:var(--yellow)}.art .body ul{padding-left:1.2em;margin:0 0 1em}.art .body li{margin:.3em 0}
.art .body blockquote{margin:1.2em 0;padding:12px 18px;border-left:4px solid var(--orange);background:rgba(255,90,54,.08);border-radius:0 14px 14px 0;color:#fff;font-style:italic}
.rx-wrap{margin:30px 0 8px;padding:20px;border-radius:22px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.rx-wrap h4{margin:0 0 12px;color:var(--muted);font:500 11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.rxs{display:flex;flex-wrap:wrap;gap:8px}
.rx{position:relative;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg);border-radius:999px;padding:8px 13px 8px 10px;font:600 14px Archivo,sans-serif;cursor:pointer;transition:transform .12s,border-color .15s,background-color .15s;user-select:none;-webkit-tap-highlight-color:transparent}
.rx:hover{border-color:var(--purple);transform:translateY(-2px)}.rx:active{transform:scale(.94)}
.rx .e{font-size:20px;line-height:1;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.rx:hover .e{transform:scale(1.18) rotate(-6deg)}
.rx .n{font-variant-numeric:tabular-nums;min-width:1ch;color:var(--muted)}
.rx.on{border-color:var(--orange);background:rgba(255,90,54,.16)}.rx.on .n{color:#fff}
.rx.pop .e{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{40%{transform:scale(1.55) rotate(-10deg)}}
.rx .fly{position:absolute;left:12px;top:-6px;font-size:22px;pointer-events:none;animation:fly .9s ease-out forwards}@keyframes fly{to{transform:translateY(-46px) scale(1.4);opacity:0}}
.rx[disabled]{opacity:.6;cursor:wait}
.rx-note{color:var(--muted);font-size:12px;margin:10px 0 0}
.shr{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.shr button,.shr a{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:10px 16px;font:600 14px Archivo,sans-serif;cursor:pointer;text-decoration:none}.shr button:hover,.shr a:hover{border-color:var(--purple)}.shr svg{width:16px;height:16px}
.rel{margin-top:30px}.rel h4{margin:0 0 12px;color:var(--muted);font:500 11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.rel .lst{display:grid;gap:10px}.rel button{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px;padding:8px;color:var(--fg);cursor:pointer;font:inherit}.rel button:hover{border-color:var(--purple)}
.rel .th{aspect-ratio:16/9;border-radius:10px;overflow:hidden;position:relative;background:#141a33}.rel .th img,.rel .th .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.rel b{display:block;font-size:14px;line-height:1.3}.rel small{color:var(--muted)}
#toast2{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);background:#131833;border:1px solid var(--green);border-radius:14px;padding:12px 20px;opacity:0;transition:.25s;z-index:120;pointer-events:none}#toast2.on{opacity:1;transform:translateX(-50%)}
.newp{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:70;background:var(--purple);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:700 14px Archivo,sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up .35s both}
@media(max-width:600px){.art{border-radius:0;border-left:0;border-right:0}.rov{padding:0}.nc .bd{padding:14px}}
</style></head>
<body><header class="top" id="top"></header><script src="nav.js"></script>
<main class="wrap">
  <div class="nhead"><div><div class="eyebrow mono">Comunidad</div><h1 class="x">Noticias</h1><p class="sub">Lo último de Magna Sports: ligas, torneos, fichajes, resultados y comunicados oficiales.</p></div>
  <a class="ncreate" id="create" href="admin.html#crear-noticia" hidden>+ Crear noticia</a></div>
  <section id="featWrap" hidden><div class="sec-t"><h2 class="x">Destacadas</h2></div><div class="feat" id="feat"></div></section>
  <div class="sec-t"><h2 class="x">Últimas noticias</h2></div>
  <div class="ftr" id="ftr" role="tablist" aria-label="Categorías"></div>
  <div class="srch"><input class="search" id="q" placeholder="Buscar noticia…" aria-label="Buscar noticia"></div>
  <div class="ng" id="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <div class="more"><button class="rd" id="more" hidden>Ver más noticias</button></div>
  <p class="foot">Magna Sports es una comunidad independiente y gratuita. No es una plataforma oficial de Supercell ni está afiliada a ella.</p>
</main>
<div id="toast2" role="status"></div>
<script src="data.js"></script><script src="store.js"></script><script src="cloud.js"></script><script src="live.js" defer></script><script src="news-core.js"></script><script src="noticias.js"></script>
</body></html>
