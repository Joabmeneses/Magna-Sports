<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a0d18"><link rel="apple-touch-icon" href="img/app/apple-touch.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Magna">
<title>Magna Arena · Panel del juez</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@500;700&display=swap"><link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="calle.css">
<style>
.jz-l{display:grid;gap:22px;grid-template-columns:minmax(0,320px) minmax(0,1fr);align-items:start;margin-top:22px}
@media(max-width:900px){.jz-l{grid-template-columns:1fr}}
.jz-box{background:#f1ead8;background-image:radial-gradient(rgba(0,0,0,.07) 1px,transparent 1.3px);background-size:7px 7px;color:#0d0d10;border:3px solid #0d0d10;border-radius:12px;box-shadow:6px 6px 0 var(--sh,#ff6a00);padding:16px}
.jz-box h2,.jz-box h3{margin:0 0 10px;font:italic 900 22px Archivo,sans-serif;text-transform:uppercase;color:#0d0d10;text-shadow:none!important}
.jz-box h3{font-size:17px}
.jz-ms{display:grid;gap:8px;max-height:70vh;overflow:auto;padding:2px 6px 6px 2px}
.jz-m{display:grid;gap:4px;text-align:left;padding:10px 12px;border:2.5px solid #0d0d10;border-radius:10px;background:#fff;color:#0d0d10;cursor:pointer;box-shadow:3px 3px 0 #0d0d10;font:700 14px Archivo,sans-serif;transition:transform .12s}
.jz-m:hover{transform:translate(-1px,-2px)}.jz-m.on{background:#c6ff1a;transform:rotate(-1deg);box-shadow:3px 3px 0 #ff6a00}
.jz-m small{font:700 10px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#5b574c}
.jz-m .t{display:flex;justify-content:space-between;gap:8px}.jz-m b{font-style:italic;font-weight:900}
.jz-ok{display:inline-block;padding:1px 7px;border-radius:999px;background:#2ee59d;border:2px solid #0d0d10;font:800 10px Archivo,sans-serif;text-transform:uppercase}.jz-lv{background:#ff3b47;color:#fff}
.jz-hd{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;text-align:center;margin-bottom:6px}
.jz-hd b{font:italic 900 clamp(20px,3vw,30px) Archivo,sans-serif;text-transform:uppercase}.jz-hd em{font:italic 900 40px Archivo,sans-serif;font-style:italic;background:#0d0d10;color:#c6ff1a;padding:2px 14px;border-radius:8px;transform:rotate(-2deg)}
.jz-sub{text-align:center;margin:0 0 14px;color:#3a372f;font-weight:600;font-size:13px}
/* rúbrica */
.jz-rb{--sh:#22b8ff}.jz-rb summary{cursor:pointer;font:italic 900 18px Archivo,sans-serif;text-transform:uppercase;list-style:none}.jz-rb summary::-webkit-details-marker{display:none}.jz-rb summary:after{content:" ▾"}
.jz-cr{display:grid;gap:8px;margin:12px 0}.jz-cr div{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 10px;background:#fff;border:2px solid #0d0d10;border-radius:8px}
.jz-cr i{font-style:normal;font-size:22px;text-align:center}.jz-cr b{display:block;font-weight:900}.jz-cr small{color:#5b574c;font-size:12.5px}.jz-cr em{font:900 12px "JetBrains Mono",monospace;font-style:normal;background:#0d0d10;color:#c6ff1a;padding:3px 7px;border-radius:6px}
.jz-sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}.jz-sc span{padding:8px 6px;border:2px solid #0d0d10;border-radius:8px;text-align:center;font:800 12px/1.25 Archivo,sans-serif}.jz-sc span b{display:block;font:italic 900 16px Archivo,sans-serif}
@media(max-width:600px){.jz-sc{grid-template-columns:repeat(2,1fr)}}
.jz-tip{margin:10px 0 0;font-size:13px;color:#3a372f}.jz-tip b{background:#c6ff1a;padding:0 3px}
/* notas */
.jz-two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.jz-two{grid-template-columns:1fr}}
.jz-tm h4{margin:0 0 8px;font:italic 900 16px Archivo,sans-serif;text-transform:uppercase;display:flex;align-items:center;gap:8px}.jz-tm h4 i{width:14px;height:14px;border-radius:50%;border:2px solid #0d0d10;background:var(--tc)}
.jz-p{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;margin-bottom:6px;background:#fff;border:2px solid #0d0d10;border-radius:8px}
.jz-p .nm{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.jz-p .nm small{display:block;font:700 10px "JetBrains Mono",monospace;color:#5b574c;text-transform:uppercase}
.jz-st{display:flex;align-items:center;gap:4px}.jz-st button{width:30px;height:30px;border:2px solid #0d0d10;border-radius:7px;background:#fff;font:900 16px Archivo,sans-serif;cursor:pointer}.jz-st button:active{transform:scale(.92)}
.jz-v{min-width:48px;text-align:center;font:italic 900 20px Archivo,sans-serif;padding:2px 6px;border-radius:7px;border:2px solid #0d0d10;background:var(--vc,#e2dbc7)}
.jz-v.na{color:#7a7566;font-size:14px}
.jz-rbb{width:auto!important;padding:0 8px;font-size:13px!important;background:#22b8ff!important;color:#fff}
.jz-q{grid-column:1/-1;display:grid;gap:6px;padding:8px;border:2px dashed #0d0d10;border-radius:8px;background:#f8f4e8}
.jz-q div{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:13px;font-weight:700}
.jz-q .seg{display:flex;gap:3px}.jz-q .seg button{min-width:34px;height:28px;border:2px solid #0d0d10;border-radius:6px;background:#fff;font:800 12px Archivo,sans-serif;cursor:pointer}.jz-q .seg button.on{background:#c6ff1a}
.jz-q p{margin:0;display:flex;justify-content:space-between;align-items:center;font-weight:900}.jz-q p button{border:2px solid #0d0d10;border-radius:8px;background:#0d0d10;color:#c6ff1a;padding:6px 12px;font:900 13px Archivo,sans-serif;cursor:pointer}
/* goles y mvp */
.jz-g{display:grid;gap:6px}.jz-g label{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;font:800 13px Archivo,sans-serif}
.jz-g select{padding:8px;border:2.5px solid #0d0d10;border-radius:8px;background:#fff;font:700 14px Archivo,sans-serif;color:#0d0d10}
.jz-none{color:#5b574c;font-size:13px}
.jz-mvp{display:flex;flex-wrap:wrap;gap:8px}.jz-mvp button{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:2.5px solid #0d0d10;border-radius:999px;background:#fff;font:800 14px Archivo,sans-serif;cursor:pointer;box-shadow:2px 2px 0 #0d0d10}
.jz-mvp button.on{background:#ffd23f;transform:rotate(-2deg);box-shadow:3px 3px 0 #ff6a00}.jz-mvp button.on:before{content:"⭐"}
.jz-save{position:sticky;bottom:12px;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:18px;padding:12px 14px;background:#0d0d10;color:#fff;border-radius:12px;border:3px solid #c6ff1a}
.jz-save button{border:3px solid #0d0d10;border-radius:10px;padding:12px 20px;background:#c6ff1a;color:#0d0d10;font:italic 900 16px Archivo,sans-serif;text-transform:uppercase;cursor:pointer;box-shadow:3px 3px 0 #ff6a00}
.jz-save button:disabled{opacity:.6;cursor:wait}
.jz-lg{max-width:440px;margin:24px auto 0}.jz-lg label{display:block;margin:10px 0 4px;font-weight:800}.jz-lg input{width:100%;padding:12px;border:3px solid #0d0d10;border-radius:10px;font:700 16px Archivo,sans-serif}.jz-lg button{margin-top:14px;width:100%;border:3px solid #0d0d10;border-radius:10px;padding:13px;background:#c6ff1a;font:900 16px Archivo,sans-serif;cursor:pointer;box-shadow:3px 3px 0 #0d0d10}.jz-lg .err{color:#c0182c;font-weight:700;min-height:1.2em}
#jz .jz-box button{color:#0d0d10;-webkit-text-fill-color:#0d0d10}#jz .jz-save button{color:#0d0d10}.jz-mvp{margin-bottom:6px}.jz-mvp button{min-height:38px;line-height:1.2}
.jz-my{margin:-2px 0 12px;padding:8px 10px;background:#0d0d10;color:#ffd23f;border-radius:8px;font:800 13px Archivo,sans-serif}.jz-my b{display:block;font-size:18px;letter-spacing:.04em}.jz-my small{color:#cfc9b8}
.jz-qk{display:block;width:100%;margin:0 0 14px;padding:12px;border:3px solid #0d0d10;border-radius:10px;background:linear-gradient(135deg,#ff4fa3,#ff6a00);color:#fff!important;-webkit-text-fill-color:#fff!important;font:italic 900 16px Archivo,sans-serif;text-transform:uppercase;cursor:pointer;box-shadow:4px 4px 0 #0d0d10}
@media(min-width:901px){.jz-qk{display:inline-block;width:auto;padding:9px 16px;font-size:14px}}
.jzq-ov{position:fixed;inset:0;z-index:95;background:rgba(10,8,20,.82);display:grid;place-items:center;padding:12px;overflow:auto}
.jzq{width:min(100%,460px);background:#f1ead8;background-image:radial-gradient(rgba(0,0,0,.07) 1px,transparent 1.3px),radial-gradient(80% 40% at 50% 0,color-mix(in srgb,var(--tc) 45%,transparent),transparent 70%);background-size:7px 7px,auto;color:#0d0d10;border:3px solid #0d0d10;border-radius:16px;box-shadow:8px 8px 0 var(--tc);padding:14px 16px 16px;touch-action:pan-y}
.jzq.r{animation:jzqR .3s cubic-bezier(.2,1.2,.4,1)}.jzq.l{animation:jzqL .3s cubic-bezier(.2,1.2,.4,1)}@keyframes jzqR{from{opacity:0;transform:translateX(60px) rotate(2deg)}}@keyframes jzqL{from{opacity:0;transform:translateX(-60px) rotate(-2deg)}}
.jzq-t{display:flex;justify-content:space-between;align-items:center;font:800 12px "JetBrains Mono",monospace}.jzq-x{width:36px;height:36px;border:2.5px solid #0d0d10;border-radius:50%;background:#fff;color:#0d0d10;font:900 16px Archivo,sans-serif;cursor:pointer}
.jzq-bar{display:flex;gap:3px;margin:8px 0 10px}.jzq-bar i{flex:1;height:6px;border-radius:3px;background:#d8d0b8}.jzq-bar i.ok{background:#2ee59d}.jzq-bar i.on{background:#0d0d10}
.jzq-tm{font:800 11px "JetBrains Mono",monospace;text-transform:uppercase;color:#5b574c}.jzq h2{margin:2px 0 8px;font:italic 900 32px/1 Archivo,sans-serif;text-transform:uppercase}
.jzq-n{display:flex;align-items:center;gap:10px;margin-bottom:10px}.jzq-n b{font:italic 900 34px/1 Archivo,sans-serif;padding:4px 12px;border:3px solid #0d0d10;border-radius:10px}.jzq-n span{font:900 16px Archivo,sans-serif;text-transform:uppercase}
.jzq-c{padding:8px 0;border-top:2px dashed rgba(13,13,16,.18)}.jzq-c b{display:block;font-weight:900;font-size:15px}.jzq-c small{display:block;color:#5b574c;font-size:12px;margin:2px 0 6px}
.jzq-sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.jzq-sg button{min-height:42px;border:2.5px solid #0d0d10;border-radius:9px;background:#fff;color:#0d0d10;font:900 14px Archivo,sans-serif;cursor:pointer}
.jzq-sg button.on{background:#c6ff1a;box-shadow:2px 2px 0 #0d0d10;transform:translateY(-1px)}.jzq-sg button:first-child.on{background:#ff9a5a}.jzq-sg button:last-child.on{background:#2ee59d}
.jzq-prev{margin:6px 0 0;font:700 12px Archivo,sans-serif;color:#5b574c}
.jzq-nav{display:grid;grid-template-columns:auto auto 1fr;gap:8px;margin-top:12px}.jzq-nav button{min-height:46px;border:3px solid #0d0d10;border-radius:10px;background:#fff;color:#0d0d10;font:900 14px Archivo,sans-serif;cursor:pointer;padding:0 12px}.jzq-nav .sk{background:#e8e2cf}.jzq-nav .ok{background:#0d0d10;color:#c6ff1a}.jzq-nav button:disabled{opacity:.4}
#jzt{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:#0d0d10;color:#c6ff1a;border:3px solid #c6ff1a;padding:12px 18px;border-radius:12px;font:800 14px Archivo,sans-serif;opacity:0;pointer-events:none;transition:opacity .25s}#jzt.on{opacity:1}#jzt.bad{color:#fff;background:#c0182c;border-color:#fff}
</style>
</head>
