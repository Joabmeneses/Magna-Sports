.lg2-go.ld:after{content:"";position:absolute;right:16px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:lgSp .7s linear infinite}@keyframes lgSp{to{transform:rotate(360deg)}}
