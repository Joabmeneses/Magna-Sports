<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magna Arena · Mi equipo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@500;700&display=swap"><link rel="stylesheet" href="site.css">
<style>
.ce-hero{position:relative;margin:26px 0 0;border-radius:28px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(120% 90% at 0 0,color-mix(in srgb,var(--tc) 50%,transparent),transparent 60%),var(--card);padding:24px clamp(16px,4vw,34px);display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ce-hero .cr{width:88px;height:88px;font-size:28px;border:3px solid var(--tc)!important}
.ce-hero h1{margin:0;font-size:clamp(32px,6vw,58px);line-height:.95}.ce-hero .sub{margin:6px 0 0}
.ce-kp{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}.ce-kp div{background:rgba(10,13,24,.45);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px 16px;min-width:120px}.ce-kp b{display:block;font:900 26px/1 Archivo,sans-serif;font-stretch:120%}.ce-kp small{color:var(--muted);font:500 10px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase}.ce-kp .gold b{color:var(--yellow)}
.mk{display:flex;align-items:center;gap:12px;margin:14px 0 0;padding:12px 16px;border-radius:16px;border:1px solid rgba(255,77,109,.4);background:rgba(255,77,109,.07);font-size:14px}.mk.on{border-color:rgba(46,229,157,.5);background:rgba(46,229,157,.1)}.mk b{font-weight:900;text-transform:uppercase}.mk i{width:10px;height:10px;border-radius:50%;background:#ff4d6d;flex:none}.mk.on i{background:#2ee59d}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 16px}.tabs button{background:transparent;border:1px solid var(--line);color:var(--fg);padding:10px 18px;border-radius:999px;cursor:pointer;font:700 14px Archivo,sans-serif;position:relative}.tabs button.on{background:#1b2260;border-color:var(--blue)}.tabs .nb{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:999px;background:var(--orange);color:#fff;font:800 10px/18px Archivo,sans-serif;text-align:center;padding:0 4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{border-radius:20px;border:1px solid var(--line);background:var(--card);padding:16px;display:flex;flex-direction:column;gap:12px}
.pcard .tp{display:flex;align-items:center;gap:12px}.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:900 15px Archivo,sans-serif;color:#fff;background:linear-gradient(135deg,#8b5cf6,#3b4bff);flex:none;box-shadow:0 0 0 3px var(--kc)}
.pcard b.n{display:block;font:800 16px Archivo,sans-serif}.pcard small{color:var(--muted);font-size:12px}.pcard .pmd{margin-left:auto;text-align:right}.pcard .pmd b{font:900 24px/1 Archivo,sans-serif;color:var(--kc)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg button{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg);border-radius:12px;padding:9px;font:700 13px Archivo,sans-serif;cursor:pointer}.seg button.on{background:var(--purple);border-color:var(--purple);color:#fff}.seg button.on.r{background:var(--orange);border-color:var(--orange)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);border-radius:12px;padding:10px 14px;font:700 13px Archivo,sans-serif;cursor:pointer}.btn:hover{border-color:var(--purple)}.btn.o{background:var(--orange);border-color:var(--orange);color:#fff}.btn.g{background:var(--green);border-color:var(--green);color:#0a0d18}.btn.d{color:#ff8aa0;border-color:rgba(255,77,109,.4)}.btn:disabled{opacity:.45;cursor:not-allowed}
.lineup{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0 0;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}.lineup .cnt{font-size:14px;color:var(--muted)}.lineup .cnt b{color:var(--fg)}
.pitch{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;padding:18px;border-radius:22px;background:linear-gradient(180deg,rgba(46,229,157,.12),rgba(46,229,157,.03)),repeating-linear-gradient(90deg,transparent 0 40px,rgba(255,255,255,.02) 40px 80px);border:1px solid rgba(46,229,157,.25)}
.pitch .sp{min-height:84px;border-radius:16px;border:1px dashed rgba(255,255,255,.2);display:grid;place-items:center;text-align:center;padding:8px;font-size:13px;color:var(--muted)}.pitch .sp.f{border-style:solid;border-color:rgba(46,229,157,.5);background:rgba(10,13,24,.4);color:var(--fg)}.pitch .sp b{display:block;font-size:15px}.pitch .bench{grid-column:1/-1;min-height:56px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);flex-wrap:wrap}.row+.row{margin-top:8px}.row .tx{flex:1;min-width:180px}.row .tx b{display:block}.row .tx small{color:var(--muted);font-size:12px}.row .act{display:flex;gap:6px;flex-wrap:wrap}
.price{font:800 14px "JetBrains Mono",monospace;color:var(--yellow);white-space:nowrap}.lock{color:var(--muted);font-size:12px}
.st{border-radius:999px;padding:3px 10px;font:700 11px Archivo,sans-serif;border:1px solid rgba(255,255,255,.2)}.st.pending{color:var(--yellow);border-color:rgba(255,210,63,.5)}.st.accepted{color:var(--green);border-color:rgba(46,229,157,.5)}.st.rejected,.st.cancelled{color:var(--muted)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:14px;padding:11px 14px;font:500 14px Archivo,sans-serif}
.gate{text-align:center;padding:70px 0}.gate .btn{display:inline-block;text-decoration:none;margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:#131833;border:1px solid var(--line);color:var(--fg);padding:12px 18px;border-radius:14px;font:600 14px Archivo,sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:calc(100vw - 24px)}.toast.bad{border-color:var(--red);color:#ffb3c0}.toast.ok{border-color:var(--green)}
.em{color:var(--muted)}h3.x{margin:22px 0 10px}
.ov{position:fixed;inset:0;z-index:95;background:rgba(5,7,14,.75);display:grid;place-items:center;padding:16px}.dlg{background:#131833;border:1px solid var(--line);border-radius:22px;padding:20px;width:min(420px,100%)}.dlg h3{margin:0 0 8px}.dlg input{width:100%;margin:10px 0;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px;font:700 18px Archivo,sans-serif}.dlg .r{display:flex;gap:8px;justify-content:flex-end}
@media(max-width:600px){.ce-kp{margin-left:0;width:100%}.ce-kp div{flex:1;min-width:0}.pitch{grid-template-columns:1fr}}
</style></head>
