<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magna Arena · Equipos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#0a0d18;--fg:#f1f3fb;--muted:#9aa0b8;--line:#1b2030;--blue:#3b4bff;--orange:#ff5a36;--gold:#ffb020;--purple:#8b5cf6;--green:#2ee59d;--red:#ff4d5e;--card:#0f1326;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}



*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 Archivo,system-ui,sans-serif;overflow-x:hidden;transition:background-color .4s,color .4s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 50% 0%,rgba(139,92,246,.22),transparent 70%),repeating-radial-gradient(circle at 100% 6%,transparent 0 28px,color-mix(in srgb,var(--fg) 4%,transparent) 28px 30px)}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px;position:relative}
.mono{font:500 12px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
.x{font-stretch:125%;font-weight:900;text-transform:uppercase}
header{border-bottom:1px solid var(--line);position:relative}
.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-top:18px}
.logo{display:flex;align-items:center;gap:12px;font-size:clamp(22px,6.6vw,34px);white-space:nowrap}
.logo i{width:16px;height:16px;border-radius:50%;background:var(--orange)}
#theme{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--fg) 6%,transparent);color:var(--fg);cursor:pointer;display:grid;place-items:center;transition:transform .15s}
#theme:active{transform:scale(.92)}#theme svg{transition:transform .45s cubic-bezier(.3,1.4,.5,1)}#theme.flip svg{transform:rotate(180deg)}
nav{order:3;width:100%;display:flex;gap:26px;padding:10px 10px 16px;overflow-x:auto}
nav a{color:var(--fg);text-decoration:none;font-weight:600;font-size:17px;white-space:nowrap;opacity:.8;transition:opacity .2s,color .2s}
nav a:hover{opacity:1}nav a.on{opacity:1;color:var(--orange)}
.top{padding:30px 0 4px}
.tag{display:inline-flex;align-items:center;gap:10px;color:var(--muted)}
.lv{width:9px;height:9px;border-radius:50%;background:var(--orange);display:inline-block;flex:none;animation:blink 1.3s ease-in-out infinite}
@keyframes blink{50%{opacity:.15}}
h1{margin:14px 0 8px;font-size:clamp(34px,9.5vw,72px);line-height:.98}
.sub{margin:0;color:var(--muted)}
.kp{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.kp div{border:1px solid var(--line);border-radius:16px;padding:10px 16px;background:color-mix(in srgb,var(--fg) 4%,transparent)}
.kp b{display:block;font:800 22px Archivo,sans-serif;font-variant-numeric:tabular-nums}.kp small{color:var(--muted)}
.ctl{display:flex;flex-direction:column;gap:12px;margin:20px 0 8px}
.srch{position:relative}.srch input{width:100%;padding:14px 16px 14px 46px;border-radius:999px;border:2px solid var(--line);background:color-mix(in srgb,var(--fg) 5%,transparent);color:var(--fg);font:600 16px Archivo,sans-serif;outline:none;transition:border-color .25s,box-shadow .25s}
.srch input:focus{border-color:var(--purple);box-shadow:0 0 0 4px color-mix(in srgb,var(--purple) 22%,transparent)}
.srch svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--fg);font:600 13px Archivo,sans-serif;padding:9px 15px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background-color .25s,border-color .25s,transform .15s}
.chip:active{transform:scale(.95)}.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}.chip b{font:700 11px "JetBrains Mono",monospace;opacity:.6}
.chip.on{background:color-mix(in srgb,var(--c,var(--blue)) 30%,transparent);border-color:var(--c,var(--blue))}
.sel2{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 13px Archivo,sans-serif;padding:9px 12px;border-radius:999px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 0 8px}
.tc{--lc:#8b5cf6;--tc:#8b5cf6;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;padding:14px 12px 14px;text-align:center;cursor:pointer;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--tc) 34%,transparent),transparent 62%),var(--card);display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .3s cubic-bezier(.3,1.5,.5,1),border-color .3s,box-shadow .3s;outline:none}
.tc::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--lc)}
.tc:hover,.tc:focus-visible{transform:translateY(-5px);border-color:var(--lc);box-shadow:0 14px 34px color-mix(in srgb,var(--lc) 28%,transparent)}
.tc:active{transform:scale(.97)}
.tc-top{display:flex;justify-content:space-between;align-items:center;width:100%;gap:6px;min-height:18px}
.lg{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}.lg i{width:7px;height:7px;border-radius:50%;background:var(--lc)}
.lvb{font:700 10px "JetBrains Mono",monospace;background:var(--orange);color:#0a0d18;border-radius:99px;padding:3px 7px;animation:blink 1.4s ease-in-out infinite}
.tc .cr{width:clamp(70px,22vw,96px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid color-mix(in srgb,#fff 35%,transparent);box-shadow:0 10px 24px rgba(0,0,0,.3);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.tc:hover .cr{transform:rotate(-6deg) scale(1.08)}
.tc h3{margin:2px 0 0;font-size:clamp(13px,3.7vw,17px);line-height:1.1;font-stretch:108%;overflow-wrap:anywhere}
.ps{display:flex;gap:8px;justify-content:center}
.ps span{background:color-mix(in srgb,var(--fg) 8%,transparent);border-radius:12px;padding:5px 9px;min-width:56px}
.ps b{display:block;font:800 15px Archivo,sans-serif}.ps small{display:block;font:500 9px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.form{display:flex;gap:5px;justify-content:center}
.form i{width:11px;height:11px;border-radius:50%;display:block;animation:fpop .45s cubic-bezier(.3,1.8,.5,1) both}
.form i.w{background:var(--green)}.form i.l{background:var(--red)}.form i.e{border:1.5px dashed var(--muted);opacity:.5}
@keyframes fpop{from{transform:scale(0)}}
.tc .sel{position:absolute;right:10px;bottom:10px;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:0;transition:all .25s cubic-bezier(.3,1.8,.5,1);opacity:0;transform:scale(.6)}
.cmp .tc .sel{opacity:1;transform:none}
.tc.pk{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}.tc.pk .sel{background:var(--gold);border-color:var(--gold);color:#0a0d18;font-size:14px;font-weight:900}
.empty{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--muted)}
.note{color:var(--muted);font-size:13px;text-align:center;margin:20px 0 90px}
.im{display:block;width:100%;height:100%;background:center/cover no-repeat}
.im.e{border:2px dashed var(--purple);background:color-mix(in srgb,var(--fg) 8%,transparent)}

#cb{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:40;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:#0e1226;color:#fff;box-shadow:0 0 0 2px var(--gold),0 12px 40px rgba(0,0,0,.5);transform:translateY(160%);transition:transform .45s cubic-bezier(.2,1.2,.4,1)}
#cb.show{transform:none}
#cb .sl{display:flex;gap:8px;flex:1}
#cb .sl span{width:44px;height:44px;border-radius:50%;border:2px dashed rgba(255,255,255,.4);overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.5);font-weight:800}
#cb .sl span.f{border-style:solid;border-color:var(--gold)}
#cb button{border:0;border-radius:14px;padding:12px 16px;font:800 14px Archivo,sans-serif;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff8a5c,#ff5a36)}
#cb button:disabled{filter:grayscale(.9) brightness(.6);cursor:not-allowed}
#cb .xx{background:rgba(255,255,255,.14);padding:12px 14px}
.sov{position:fixed;inset:0;z-index:72;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,7,14,.66);opacity:0;transition:opacity .25s}
.sov.show{opacity:1}
.sh{width:min(100%,640px);max-height:92vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;background:#0e1226;color:#f1f3fb;box-shadow:0 0 0 2px var(--lc,var(--blue)),0 -8px 40px color-mix(in srgb,var(--lc,var(--blue)) 40%,transparent);transform:translateY(100%);transition:transform .4s cubic-bezier(.2,1.2,.4,1)}
.sov.show .sh{transform:none}
.shh{display:flex;justify-content:flex-end;margin-bottom:4px}
.xb{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font:400 24px/1 Archivo,sans-serif;cursor:pointer}
.dh{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.dh .cr{width:88px;height:88px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.4);flex:none;box-shadow:0 0 0 5px color-mix(in srgb,var(--tc) 40%,transparent)}
.dh h2{margin:0;font-size:clamp(22px,6vw,32px);line-height:1.05;overflow-wrap:anywhere}
.dh small{display:block;color:rgba(255,255,255,.65);margin-top:4px}
