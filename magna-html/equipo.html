<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magna Arena · Equipo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@500;700&display=swap"><link rel="stylesheet" href="site.css">
<style>
/* portada */
.eq-hero{position:relative;margin:26px 0 0;border-radius:32px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--tc) 55%,transparent),transparent 60%),radial-gradient(80% 80% at 100% 100%,rgba(59,75,255,.35),transparent 70%),var(--card);padding:34px clamp(18px,4vw,44px) 28px}
.eq-hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 26px,rgba(255,255,255,.025) 26px 27px);pointer-events:none}
.eq-hero .wm{position:absolute;right:-2%;bottom:-18%;font:900 clamp(120px,22vw,300px)/1 Archivo,sans-serif;font-stretch:125%;color:rgba(255,255,255,.04);text-transform:uppercase;white-space:nowrap;pointer-events:none;letter-spacing:-.03em}
.eq-top{position:relative;display:flex;align-items:center;gap:clamp(16px,3vw,34px);flex-wrap:wrap}
.eq-cr{width:clamp(96px,16vw,160px);height:clamp(96px,16vw,160px);font-size:clamp(30px,5vw,54px);border:4px solid var(--tc)!important;box-shadow:0 0 0 8px color-mix(in srgb,var(--tc) 18%,transparent),0 20px 60px rgba(0,0,0,.45)}
.eq-id{min-width:0;flex:1}
.eq-id .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.eq-id .tags span{border:1px solid rgba(255,255,255,.18);background:rgba(10,13,24,.35);border-radius:999px;padding:5px 12px;font:600 12px Archivo,sans-serif}.eq-id .tags .lv{background:var(--orange);border-color:var(--orange);color:#fff}
.eq-id h1{margin:0;font-size:clamp(40px,8vw,88px);line-height:.92;overflow-wrap:anywhere}
.eq-id p{margin:12px 0 0;color:#c9cde0;max-width:60ch}
.eq-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.eq-act a,.eq-act button{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.2);background:rgba(10,13,24,.4);color:var(--fg);border-radius:999px;padding:9px 16px;font:700 13px Archivo,sans-serif;text-decoration:none;cursor:pointer}.eq-act a:hover,.eq-act button:hover{border-color:var(--tc)}
.eq-kpi{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:26px}
.eq-kpi div{background:rgba(10,13,24,.45);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px 16px;min-width:0}.eq-kpi b{display:block;font:900 clamp(22px,3.4vw,34px)/1 Archivo,sans-serif;font-stretch:120%;font-variant-numeric:tabular-nums}.eq-kpi small{display:block;margin-top:6px;color:var(--muted);font:500 10px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
.eq-kpi .gold b{color:var(--yellow)}
/* secciones */
.eq-sec{margin-top:40px}.eq-sec>h2{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;font-size:clamp(24px,4vw,34px)}.eq-sec>h2 small{font:500 12px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--muted)}
.eq-two{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:start}@media(max-width:900px){.eq-two{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px}
.em{color:var(--muted)}
/* vitrina */
.vit{position:relative;border-radius:26px;padding:22px 18px 8px;background:linear-gradient(180deg,rgba(255,210,63,.1),rgba(255,210,63,.02) 60%),var(--card);border:1px solid rgba(255,210,63,.28);overflow:hidden}
.vit-cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.vit-cats span{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:13px;color:#c9cde0}.vit-cats b{color:var(--yellow)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding-bottom:18px;position:relative}
.tro2{position:relative;text-align:center;padding:18px 10px 14px;border-radius:20px;background:radial-gradient(70% 60% at 50% 25%,color-mix(in srgb,var(--cc) 30%,transparent),transparent 70%),rgba(10,13,24,.55);border:1px solid color-mix(in srgb,var(--cc) 45%,transparent);animation:trIn .5s cubic-bezier(.2,.9,.2,1) both;transition:transform .2s}
.tro2:hover{transform:translateY(-4px)}
.tro2 .ic{font-size:44px;line-height:1;display:block;filter:drop-shadow(0 8px 18px color-mix(in srgb,var(--cc) 60%,transparent))}
.tro2 b{display:block;margin-top:10px;font:800 14px/1.2 Archivo,sans-serif;overflow-wrap:anywhere}.tro2 small{display:block;margin-top:5px;color:var(--muted);font:500 10px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
.tro2 .yr{position:absolute;top:8px;right:10px;font:700 11px "JetBrains Mono",monospace;color:var(--cc)}
@keyframes trIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
.vit-empty{text-align:center;padding:26px 10px 30px;color:var(--muted)}.vit-empty span{display:block;font-size:48px;opacity:.5;margin-bottom:8px}
/* rendimiento */
.perf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.perf div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.perf b{display:block;font:900 24px Archivo,sans-serif}.perf small{color:var(--muted);font:500 10px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
.frm{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 4px;color:var(--muted);font-size:13px}.frm .d{display:flex;gap:6px}.frm i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:800 12px Archivo,sans-serif;font-style:normal;color:#0a0d18}.frm .w{background:var(--green)}.frm .l{background:var(--red)}.frm .e{background:rgba(255,255,255,.08)}
.pbd{margin-top:16px;display:grid;gap:10px}.pbd .r{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13px}.pbd .br{height:10px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}.pbd .br i{display:block;height:100%;width:0;border-radius:9px;background:var(--cc);transition:width 1s cubic-bezier(.2,.9,.2,1)}.pbd b{font-variant-numeric:tabular-nums}
/* plantilla */
.sqd{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pc2{position:relative;border-radius:22px;padding:18px 16px 14px;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 22%,transparent),transparent 55%),var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;animation:trIn .45s cubic-bezier(.2,.9,.2,1) both;text-decoration:none;color:inherit}
.pc2 .top{display:flex;align-items:center;gap:12px}.pc2 .av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--kc) calc(var(--pc)*1%),rgba(255,255,255,.1) 0);flex:none;position:relative}.pc2 .av i{position:absolute;inset:4px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#3b4bff);display:grid;place-items:center;font:900 16px Archivo,sans-serif;font-style:normal;color:#fff}
.pc2 b.n{display:block;font:800 17px/1.15 Archivo,sans-serif;overflow-wrap:anywhere}.pc2 .rl{color:var(--muted);font-size:12px}
.pc2 .pmd{margin-left:auto;text-align:right}.pc2 .pmd b{display:block;font:900 28px/1 Archivo,sans-serif;font-stretch:120%;color:var(--kc)}.pc2 .pmd small{color:var(--muted);font:500 9px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
.pc2 .pst{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.pc2 .pst div{background:rgba(255,255,255,.05);border-radius:12px;padding:7px 2px}.pc2 .pst b{display:block;font:800 15px Archivo,sans-serif}.pc2 .pst small{color:var(--muted);font:500 8px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.pc2 .pbg{display:flex;gap:4px;justify-content:flex-end;margin:-6px -4px 0}.pc2 .pbg span{border-radius:999px;padding:2px 8px;font:700 10px Archivo,sans-serif;border:1px solid rgba(255,255,255,.2)}.pc2 .pbg .dt{background:var(--yellow);border-color:var(--yellow);color:#0a0d18}
.pc2 .tl{display:flex;flex-wrap:wrap;gap:4px}.pc2 .tl span{font-size:11px;border-radius:999px;padding:2px 8px;background:rgba(255,210,63,.12);color:var(--yellow)}
/* partidos */
.mlst{display:grid;gap:8px}.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:inherit}
a.mrow:hover{border-color:var(--tc)}.mrow .cr{width:40px;height:40px;font-size:13px;border-width:2px}.mrow b{display:block;font-size:15px}.mrow small{color:var(--muted);font-size:12px}
.mrow .sc{text-align:right}.mrow .sc b{font:900 20px Archivo,sans-serif;font-variant-numeric:tabular-nums}.mrow .res{display:inline-block;margin-left:8px;width:24px;height:24px;border-radius:7px;text-align:center;font:800 12px/24px Archivo,sans-serif;color:#0a0d18}.mrow .res.w{background:var(--green)}.mrow .res.l{background:var(--red)}
.mrow .lvb{background:var(--orange);color:#fff;border-radius:999px;padding:3px 10px;font:700 11px "JetBrains Mono",monospace}
.mrow .sets{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.mrow .sets span{font-size:10px;border-radius:6px;padding:2px 6px;background:rgba(255,255,255,.06);border-left:3px solid var(--mc)}
.cmp{display:grid;gap:8px}.cmp a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:inherit}.cmp a:hover{border-color:var(--tc)}.cmp b{display:block;font-size:15px}.cmp small{color:var(--muted);font-size:12px}.cmp .pos{font:900 22px Archivo,sans-serif;color:var(--tc)}
/* otros equipos */
.others{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}.others a{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:inherit;font-weight:700;font-size:14px}.others a:hover{border-color:var(--purple)}.others .cr{width:32px;height:32px;font-size:11px;border-width:2px}
.nf{text-align:center;padding:80px 0}
@media(max-width:700px){.eq-top{flex-direction:column;align-items:flex-start}.eq-id{width:100%}.eq-id h1{font-size:clamp(34px,12vw,60px);overflow-wrap:break-word}.eq-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.perf{grid-template-columns:repeat(2,1fr)}.pbd .r{grid-template-columns:90px 1fr auto}.eq-hero{padding-top:26px}.shelf{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.tro2,.pc2{animation:none}.pbd .br i{transition:none}}
</style></head>
<body><header class="top" id="top"></header><script src="nav.js"></script>
<main class="wrap" id="eq"></main>
<script src="data.js"></script><script src="store.js"></script><script src="cloud.js" defer></script><script src="accounts.js" defer></script><script src="live.js" defer></script><script src="site.js"></script><script src="equipo.js" defer></script></body></html>
