<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magna Arena · Agenda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#0a0d18;--fg:#f1f3fb;--muted:#9aa0b8;--line:#1b2030;--blue:#3b4bff;--orange:#ff5a36;--purple:#8b5cf6;--green:#2ee59d;--red:#ff4d5e;--card:#0f1326;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f5fb;--fg:#0a0d18;--muted:#5a6078;--line:#dcdfec;--card:#fff;color-scheme:light}}
:root[data-theme="light"]{--bg:#f4f5fb;--fg:#0a0d18;--muted:#5a6078;--line:#dcdfec;--card:#fff;color-scheme:light}
:root[data-theme="dark"]{--bg:#0a0d18;--fg:#f1f3fb;--muted:#9aa0b8;--line:#1b2030;--card:#0f1326;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 Archivo,system-ui,sans-serif;overflow-x:hidden;transition:background-color .4s,color .4s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 50% 0%,rgba(139,92,246,.2),transparent 70%),repeating-radial-gradient(circle at 100% 6%,transparent 0 28px,color-mix(in srgb,var(--fg) 4%,transparent) 28px 30px)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px;position:relative}
.mono{font:500 12px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
.x{font-stretch:125%;font-weight:900;text-transform:uppercase}
header{border-bottom:1px solid var(--line);position:relative}
.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-top:18px}
.logo{display:flex;align-items:center;gap:12px;font-size:clamp(22px,6.6vw,34px);white-space:nowrap}
.logo i{width:16px;height:16px;border-radius:50%;background:var(--orange)}
#theme{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--fg) 6%,transparent);color:var(--fg);cursor:pointer;display:grid;place-items:center;transition:transform .15s}
#theme:active{transform:scale(.92)}#theme svg{transition:transform .45s cubic-bezier(.3,1.4,.5,1)}#theme.flip svg{transform:rotate(180deg)}
nav{order:3;width:100%;display:flex;gap:26px;padding:10px 10px 16px;overflow-x:auto}
nav a{color:var(--fg);text-decoration:none;font-weight:600;font-size:17px;white-space:nowrap;opacity:.8;transition:opacity .2s,color .2s}
nav a:hover{opacity:1}nav a.on{opacity:1;color:var(--orange)}
.top{padding:30px 0 6px}
.tag{display:inline-flex;align-items:center;gap:10px;color:var(--muted)}
.lv{width:9px;height:9px;border-radius:50%;background:var(--orange);display:inline-block;flex:none;animation:blink 1.3s ease-in-out infinite}
@keyframes blink{50%{opacity:.15}}
h1{margin:14px 0 8px;font-size:clamp(34px,9.5vw,72px);line-height:.98}
.sub{margin:0;color:var(--muted)}
.next{position:relative;overflow:hidden;margin-top:22px;border-radius:26px;padding:16px 18px;background:linear-gradient(135deg,#3b4bff,#8b5cf6);color:#fff;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.next:hover{transform:translateY(-3px)}
.next::before{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 22px,rgba(255,255,255,.14) 22px 24px);animation:rot 14s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.next>*{position:relative}
.nx-c{display:flex;flex:none}.nx-c .cr{width:46px;height:46px;border:3px solid #fff;margin-left:-14px}.nx-c .cr:first-child{margin-left:0}
.nx-t{flex:1;min-width:0}.nx-t small{display:block;opacity:.85;margin-bottom:6px}.nx-t b{display:block;font-size:clamp(15px,4.4vw,19px);line-height:1.15;overflow-wrap:anywhere}
.nx-d{text-align:right;flex:none}.nx-d b{display:block;font:700 clamp(20px,6vw,30px)/1 "JetBrains Mono",monospace;letter-spacing:.02em}.nx-d small{opacity:.85}
.ctl{display:flex;flex-direction:column;gap:14px;margin:22px 0 6px}
.days{position:relative;display:flex;background:color-mix(in srgb,var(--fg) 7%,transparent);border-radius:999px;padding:5px}
.days .ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:999px;background:var(--blue);transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.days[data-d="1"] .ind{transform:translateX(100%)}
.days button{position:relative;z-index:1;flex:1;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:999px;cursor:pointer;font:800 15px Archivo,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .3s}
.days button.on{color:#fff}
.days small{font:500 11px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.days em{position:absolute;right:12px;top:8px;font:700 11px "JetBrains Mono",monospace;font-style:normal;background:color-mix(in srgb,var(--fg) 14%,transparent);padding:3px 7px;border-radius:99px}
.days button.on em{background:rgba(255,255,255,.25)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--fg);font:600 13px Archivo,sans-serif;padding:9px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background-color .25s,border-color .25s,transform .15s}
.chip:active{transform:scale(.95)}.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}.chip b{font:700 11px "JetBrains Mono",monospace;opacity:.6}
.chip.on{background:color-mix(in srgb,var(--c,var(--fg)) 30%,transparent);border-color:var(--c,var(--fg))}
.tlw{margin:14px 0 4px}.tlh{color:var(--muted);margin-bottom:6px}
.tl{position:relative;height:58px;margin:0 8px}
.tl::before{content:"";position:absolute;left:0;right:0;top:26px;height:3px;border-radius:3px;background:var(--line)}
.tk{position:absolute;top:36px;transform:translateX(-50%);font:500 10px "JetBrains Mono",monospace;color:var(--muted)}
.td{position:absolute;top:17px;width:20px;height:20px;margin-left:-10px;border-radius:50%;border:3px solid var(--bg);background:var(--ac);cursor:pointer;padding:0;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.td:hover,.td:focus-visible{transform:scale(1.5)}
.td.lvd::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--ac);animation:ping 1.6s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(1.5);opacity:0}}
.nd{position:absolute;top:8px;bottom:12px;width:2px;background:var(--orange);margin-left:-1px;transition:left 1s linear}
.nd::before{content:"ahora";position:absolute;top:-8px;left:50%;transform:translateX(-50%);font:700 9px "JetBrains Mono",monospace;color:var(--orange);text-transform:uppercase}
.tip{position:absolute;bottom:42px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font:600 11px Archivo,sans-serif;padding:5px 9px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.list{display:grid;gap:14px;padding:12px 0 6px;touch-action:pan-y}
.ev{--bg2:#cdbdff;--fg2:#1b0f4d;--ac:#8b5cf6;position:relative;background:var(--bg2);color:var(--fg2);border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.22);transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .3s,opacity .4s,filter .4s}
.ev:hover{transform:translateY(-3px)}
.ev[data-k="live"]{animation:glow 2.4s ease-out infinite}
@keyframes glow{0%{box-shadow:0 10px 30px rgba(0,0,0,.22),0 0 0 0 var(--ac)}100%{box-shadow:0 10px 30px rgba(0,0,0,.22),0 0 0 10px transparent}}
.ev[data-k="fin"]{filter:saturate(.55);opacity:.82}
.ev.fl{animation:flash 1.2s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 6px var(--ac)}100%{box-shadow:0 10px 30px rgba(0,0,0,.22)}}
.ev-m{display:flex;gap:16px;padding:14px 16px 16px;cursor:pointer;align-items:stretch;outline:none}
.tile{width:92px;min-height:92px;border-radius:24px;background:color-mix(in srgb,var(--fg2) 12%,transparent);position:relative;flex:none}
.tile .cr{position:absolute;width:52px;height:52px;border-radius:50%;overflow:hidden;border:3px solid var(--bg2);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.tile .cr.a{left:5px;bottom:5px}.tile .cr.b{right:5px;top:5px}
.ev:hover .cr.a{transform:translate(-3px,3px) rotate(-6deg)}.ev:hover .cr.b{transform:translate(3px,-3px) rotate(6deg)}
.im{display:block;width:100%;height:100%;background:center/cover no-repeat}
.im.e{border:2px dashed var(--purple);background:color-mix(in srgb,var(--fg2) 10%,transparent)}

.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.cat{font:italic 500 13px Archivo,sans-serif;opacity:.8}
.tm{display:flex;align-items:center;gap:8px}
.nm{flex:1;min-width:0;font-size:clamp(17px,5vw,22px);line-height:1.1;overflow-wrap:anywhere}
.sc{font:900 22px/1 Archivo,sans-serif;min-width:20px;text-align:right}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px;padding-top:4px}
.bd{font:700 11px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:99px;background:color-mix(in srgb,var(--fg2) 14%,transparent);white-space:nowrap}
.ev[data-k="live"] .bd{background:var(--orange);color:#0a0d18}
.tt{font:800 16px Archivo,sans-serif;white-space:nowrap}
.pg{position:absolute;left:0;right:0;bottom:0;height:4px;background:color-mix(in srgb,var(--fg2) 12%,transparent)}
.pg i{display:block;height:100%;width:0;background:var(--ac);transition:width 1s linear}
.gtag{position:absolute;right:14px;top:14px;background:var(--green);color:#0a0d18;padding:6px 12px;border-radius:99px;font-size:13px;pointer-events:none;z-index:2}
.dt{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
.ev.open .dt{grid-template-rows:1fr}
.dti{overflow:hidden;min-height:0}
.dtc{display:grid;gap:12px;padding:0 16px 18px;opacity:0;transition:opacity .3s .1s}
.ev.open .dtc{opacity:1}
.tb{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--fg2) 9%,transparent);border-radius:18px;padding:10px 12px}
.tb .cr{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none}
.tb b{display:block;font-size:15px;line-height:1.1}.tb small{display:block;opacity:.75;font-size:12px;margin-top:2px}
.tb .form{margin-left:auto}
.form{display:flex;gap:5px}
.form i{width:12px;height:12px;border-radius:50%;display:block;animation:fpop .45s cubic-bezier(.3,1.8,.5,1) both}
.form i.w{background:#12b886}.form i.l{background:#ff4d5e}
@keyframes fpop{from{transform:scale(0)}}
.ac{display:flex;gap:8px;flex-wrap:wrap}
