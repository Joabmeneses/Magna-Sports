<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magna Arena · Perfil de jugador</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@500;700&display=swap"><link rel="stylesheet" href="site.css">
<style>
body.jp{background:#0d0b2a}
body.jp:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(45% 40% at 10% 0,var(--jc1,rgba(139,92,246,.35)),transparent 70%),radial-gradient(40% 40% at 100% 20%,var(--jc2,rgba(255,90,54,.25)),transparent 70%),radial-gradient(50% 40% at 50% 100%,rgba(34,211,238,.14),transparent 70%)}
.jp-h{position:relative;margin-top:26px;border-radius:32px;overflow:hidden;padding:clamp(22px,4.5vw,44px);border:1px solid rgba(255,255,255,.14);background:linear-gradient(135deg,var(--jt,#3b2a8a),#15123f 62%);display:grid;grid-template-columns:auto 1fr auto;gap:clamp(16px,3vw,34px);align-items:center;isolation:isolate}
.jp-h:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.14),transparent 40%),repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 22px)}
.jp-h .tav{--s:clamp(96px,14vw,150px)}
.jp-ey{font:700 12px "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.jp-nm{margin:8px 0 6px;font:900 clamp(34px,6.4vw,68px)/1.02 Archivo,sans-serif;font-stretch:118%;text-transform:uppercase;letter-spacing:-.01em;overflow-wrap:anywhere}
.jp-nm .mpn{align-items:flex-start}.jp-nm .mpn-t{font-size:14px;margin-top:6px}
.jp-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.jp-chips>*{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:rgba(10,13,24,.38);border:1px solid rgba(255,255,255,.14);font:600 13px Archivo,sans-serif;color:#fff;text-decoration:none}
.jp-chips a:hover{border-color:#fff}.jp-chips .cr{border-radius:6px}
.jp-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.jp-shc{border-radius:999px;padding:10px 16px;font:800 14px Archivo,sans-serif;cursor:pointer;color:#fff;border:0;background:linear-gradient(135deg,#ff5a36,#ff8a00);box-shadow:0 4px 0 rgba(0,0,0,.4)}.jp-shc:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}.jp-act a{border-radius:999px;padding:10px 16px;font:800 14px Archivo,sans-serif;text-decoration:none;background:#fff;color:#14113a}.jp-act a.g{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
.jp-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:18px}
.jp-k div{border-radius:20px;padding:14px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);animation:jpIn .5s both}.jp-k b{display:block;font:900 30px/1 Archivo,sans-serif;font-stretch:115%}.jp-k small{color:var(--muted);font:600 10px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
.jp-k div:nth-child(1) b{color:#a78bfa}.jp-k div:nth-child(2) b{color:#2ee59d}.jp-k div:nth-child(3) b{color:#ffd23f}.jp-k div:nth-child(4) b{color:#ff8a65}.jp-k div:nth-child(5) b{color:#22d3ee}.jp-k div:nth-child(6) b{color:#f472b6}
.jp-s{margin-top:38px}.jp-s>h2{margin:0 0 4px;font-size:clamp(22px,3.4vw,32px)}.jp-s>p{margin:0 0 14px;color:var(--muted)}
.jp-two{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.jp-box{border-radius:24px;padding:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1)}
/* vitrina */
.jp-vit{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.jp-tr{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:16px 10px;border-radius:20px;background:linear-gradient(180deg,rgba(255,210,63,.16),rgba(255,255,255,.03));border:1px solid rgba(255,210,63,.3);animation:jpIn .5s both}
.jp-tr i{font-style:normal;font-size:34px;filter:drop-shadow(0 6px 10px rgba(255,196,0,.35))}.jp-tr b{font:800 14px Archivo,sans-serif}.jp-tr small{color:var(--muted);font-size:12px}
.jp-tr.bo{background:linear-gradient(180deg,rgba(255,196,0,.32),rgba(139,92,246,.12));border-color:#ffd23f}
/* insignias */
.jp-bd{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.bd{position:relative;padding:14px 10px 12px;border-radius:20px;text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);transition:transform .2s}
.bd:hover{transform:translateY(-3px)}.bd i{display:grid;place-items:center;margin:0 auto 6px;width:52px;height:52px;border-radius:50%;font-style:normal;font-size:26px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(139,92,246,.35));box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.bd b{display:block;font:800 13px Archivo,sans-serif}.bd small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.bd.ok{border-color:rgba(46,229,157,.45);background:linear-gradient(180deg,rgba(46,229,157,.14),rgba(255,255,255,.03))}.bd.ok i{background:radial-gradient(circle at 35% 30%,#fff7c2,#ffc400 60%,#a86f00);box-shadow:0 0 0 2px #ffd23f,0 8px 20px -6px rgba(255,196,0,.6)}
.bd.lk{opacity:.62}.bd.lk i{filter:grayscale(1)}.bd .pg{height:5px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}.bd .pg span{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#22d3ee)}
.jp-bdh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.jp-bdh .cnt{font:900 22px Archivo,sans-serif;color:#2ee59d}
/* inventario */
.jp-inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.iv{border-radius:20px;padding:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:8px;animation:jpIn .45s both}.iv.on{border-color:#2ee59d;box-shadow:0 0 0 1px #2ee59d inset}
.iv .cos-prev{min-height:76px;font-size:16px}.iv b{font:800 14px Archivo,sans-serif}.iv .mt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}.iv .eqd{color:#2ee59d;font:700 10px "JetBrains Mono",monospace;letter-spacing:.06em}
/* partidos */
.jp-gm{display:grid;gap:8px}.gm{display:grid;grid-template-columns:34px 1fr auto auto;gap:12px;align-items:center;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.gm .grs{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:900 13px Archivo,sans-serif;color:#0a0d18}.gm .grs.W{background:#2ee59d}.gm .grs.L{background:#ff5a6a}.gm .grs.D{background:#9aa0b8}
.gm .gvs{min-width:0}.gm .gvs b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gm .gvs small{color:var(--muted);font-size:12px}.gm .gex{display:flex;gap:6px;font-size:13px}.gm .gnt{min-width:44px;text-align:center;padding:5px 8px;border-radius:10px;font:900 15px Archivo,sans-serif;background:rgba(255,255,255,.08)}
.gnt.hi{background:#2ee59d;color:#0a0d18}.gnt.md{background:#ffd23f;color:#1a1200}.gnt.lo{background:#ff5a6a;color:#fff}
.jp-spark{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:6px}.jp-spark i{flex:1;min-width:6px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#22d3ee,#8b5cf6);animation:jpUp .6s both;transform-origin:bottom}
@keyframes jpUp{from{transform:scaleY(0)}}@keyframes jpIn{from{opacity:0;transform:translateY(10px)}}
.jp-emp{padding:22px;border-radius:20px;border:1px dashed rgba(255,255,255,.2);text-align:center;color:var(--muted)}
/* directorio */
.jp-dir-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 16px}.jp-dir-top h1{margin:0;font-size:clamp(32px,6vw,58px);flex:1 1 260px}
.jp-q{flex:1 1 240px;max-width:360px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(10,13,24,.5);color:#fff;padding:12px 18px;font:500 15px Archivo,sans-serif}
.jp-dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.jd{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);text-decoration:none;color:inherit;transition:transform .15s,border-color .15s;min-width:0}.jd:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.35)}
.jd>div{min-width:0}.jd b{display:block}.jd .mpn{max-width:100%}.jd small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:860px){.jp-h{grid-template-columns:auto 1fr}.jp-h .tcard{display:none}.jp-two{grid-template-columns:1fr}}
@media(max-width:560px){.jp-bd{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.bd{padding:10px 6px}.bd i{width:42px;height:42px;font-size:21px}.bd small{font-size:10px}.jp-h{grid-template-columns:1fr;text-align:left}.jp-h .tav{--s:96px}.gm{grid-template-columns:30px 1fr auto}.gm .gex{display:none}}
@media(prefers-reduced-motion:reduce){.jp-k div,.jp-tr,.iv,.jp-spark i{animation:none}}

/* ===== portada estilo pantalla de héroe ===== */
body.jp{background:#160f33}
body.jp:after{background:radial-gradient(60% 50% at 50% 0,rgba(139,92,246,.35),transparent 70%),radial-gradient(40% 40% at 100% 60%,rgba(34,211,238,.12),transparent 70%)}
.hx-h{--tc:#8b5cf6;--tr:#c9cfdc;position:relative;margin-top:22px;border-radius:28px;overflow:hidden;isolation:isolate;padding:14px clamp(14px,2.5vw,26px) 22px;background:linear-gradient(180deg,#2a1d63,#1d1450 55%,#140e3a);border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 60px -30px #000}
.hx-h:before{content:"";position:absolute;left:-20%;right:-20%;bottom:-2%;height:46%;z-index:-1;background:linear-gradient(transparent 0 calc(100% - 2px),rgba(255,79,163,.45) 0) 0 0/100% 34px,linear-gradient(90deg,transparent 0 calc(100% - 2px),rgba(139,92,246,.45) 0) 0 0/60px 100%;transform:perspective(320px) rotateX(58deg);transform-origin:50% 100%;-webkit-mask:linear-gradient(transparent,#000 70%);mask:linear-gradient(transparent,#000 70%);animation:hxGrid 6s linear infinite}
@keyframes hxGrid{to{background-position:0 34px,0 0}}
.hx-h:after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(40% 60% at 50% 40%,color-mix(in srgb,var(--tc) 45%,transparent),transparent 70%)}
.hx-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.hx-top .sp{flex:1}
.hx-bk{display:inline-flex;align-items:center;gap:8px;padding:7px 16px 7px 10px;color:#fff;text-decoration:none;background:linear-gradient(90deg,rgba(139,92,246,.6),rgba(139,92,246,0));clip-path:polygon(0 0,100% 0,92% 100%,0 100%);transition:padding .2s}.hx-bk:hover{padding-left:6px}.hx-bk .ar{font:900 20px/1 Archivo,sans-serif}.hx-bk b{font:italic 900 17px Archivo,sans-serif;font-stretch:118%;letter-spacing:.02em}
.hx-cur{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:rgba(5,4,20,.55);border:1px solid rgba(255,255,255,.15)}.hx-cur i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;background:rgba(255,255,255,.1)}.hx-cur b{font:800 14px Archivo,sans-serif}
.hx-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px) minmax(0,1.15fr);gap:clamp(14px,2.5vw,30px);align-items:center;margin-top:10px}
/* izquierda */
.hx-nm{margin:0;font:italic 900 clamp(38px,5.6vw,72px)/.95 Archivo,sans-serif;font-stretch:118%;text-transform:uppercase;letter-spacing:-.01em;overflow-wrap:anywhere;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.hx-nm .mpn{display:inline-flex;flex-direction:column;align-items:flex-start}.hx-nm .mpn-t{font:800 13px Archivo,sans-serif;font-style:normal;letter-spacing:.02em;margin-top:8px}
.hx-sub{margin-top:6px;color:#b9b2e0;font:700 12px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.hx-tm{display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:6px 14px 6px 6px;border-radius:12px;background:color-mix(in srgb,var(--tc) 28%,rgba(5,4,20,.5));border:1px solid color-mix(in srgb,var(--tc) 60%,transparent);color:#fff;text-decoration:none;font:900 15px Archivo,sans-serif;text-transform:uppercase;transition:transform .15s}.hx-tm:hover{transform:translateX(4px)}.hx-tm.free{padding:8px 14px}
.hx-since{margin-top:10px;color:#9a93c6;font-size:12.5px}
.hx-ic{display:flex;flex-direction:column;gap:10px;margin-top:18px}.hx-ic button{width:42px;height:42px;display:grid;place-items:center;font-size:18px;border:0;cursor:pointer;color:#fff;background:linear-gradient(180deg,#e9e6ff,#b9b2e0);clip-path:polygon(0 0,100% 0,100% 78%,78% 100%,0 100%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);transition:transform .15s}.hx-ic button:hover{transform:translateX(4px) scale(1.06)}
/* centro */
.hx-c{position:relative;height:clamp(320px,38vw,430px);display:grid;place-items:center}
.hx-c:before{content:"";position:absolute;inset:0 6%;background:linear-gradient(180deg,#a78bfa,#7c3aed 45%,#5b21b6);clip-path:polygon(18% 0,100% 0,82% 100%,0 100%);box-shadow:inset 0 0 0 4px rgba(255,255,255,.25)}
.hx-c:after{content:"";position:absolute;inset:0 6%;background:linear-gradient(180deg,transparent 55%,color-mix(in srgb,var(--tc) 70%,transparent));clip-path:polygon(18% 0,100% 0,82% 100%,0 100%);mix-blend-mode:screen;opacity:.7}
.hx-wm{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);font:italic 900 clamp(70px,9vw,120px)/1 Archivo,sans-serif;font-stretch:125%;text-transform:uppercase;color:rgba(255,255,255,.14);white-space:nowrap;pointer-events:none}
.hx-pt{position:relative;z-index:2;width:clamp(170px,19vw,230px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(160deg,#3b2a8a,#140e3a);box-shadow:0 0 0 6px #fff,0 0 0 10px var(--tc),0 0 60px color-mix(in srgb,var(--tc) 80%,transparent),0 30px 50px rgba(0,0,0,.55);transition:transform .25s ease-out;animation:hxFl 4s ease-in-out infinite}
.hx-ptw{position:relative;z-index:2;border-radius:50%;--s:clamp(170px,19vw,230px);font-size:16px;animation:hxFl 4s ease-in-out infinite}.hx-ptw>.hx-pt{animation:none}.hx-ptw[class*="fr-"]>.hx-pt{box-shadow:0 0 0 4px #fff,0 30px 50px rgba(0,0,0,.55)}
.hx-pt img{width:100%;height:100%;object-fit:cover}.hx-pt span{font:italic 900 clamp(60px,7vw,90px)/1 Archivo,sans-serif;font-stretch:118%;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35)}
@keyframes hxFl{50%{translate:0 -8px}}
.hx-tier{position:absolute;z-index:3;bottom:8%;left:50%;transform:translateX(-50%) rotate(-3deg);padding:6px 18px;background:var(--tr);color:#140e3a;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.4)}.hx-tier small{display:block;font:900 9px "JetBrains Mono",monospace;letter-spacing:.14em}.hx-tier b{font:italic 900 20px/1 Archivo,sans-serif;font-stretch:118%;text-transform:uppercase}
.hx-sp{position:absolute;z-index:2;bottom:12%;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 20px var(--tc);opacity:0;animation:hxSp 3s ease-out infinite}@keyframes hxSp{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-260px)}}
/* derecha */
.hx-lv{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.hx-lv b{font:italic 900 clamp(28px,3.6vw,44px)/1 Archivo,sans-serif;font-stretch:115%}.hx-lv b .n{color:#fff;text-shadow:0 0 18px var(--tr)}.hx-lv small{font:800 14px Archivo,sans-serif;color:#d9d3ff}
.hx-xp{margin-top:8px;height:12px;background:#0a0720;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}.hx-xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#c084fc,var(--tr));box-shadow:0 0 12px var(--tr);transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.hx-sr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.hx-stars{display:flex;gap:4px}.hx-stars i{font-style:normal;font-size:28px;line-height:1;color:#0a0720;-webkit-text-stroke:1.5px rgba(255,255,255,.35)}.hx-stars i.on{color:#fff;-webkit-text-stroke:0;text-shadow:0 0 12px rgba(255,255,255,.7);animation:hxStar .5s both}@keyframes hxStar{from{transform:scale(0) rotate(-90deg)}}
.hx-nx{padding:6px 14px;background:rgba(139,92,246,.35);border-left:4px solid #a78bfa;font:italic 900 13px Archivo,sans-serif;clip-path:polygon(0 0,100% 0,94% 100%,0 100%)}
.hx-pn{margin-top:16px}.hx-ph{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid rgba(255,255,255,.85)}.hx-ph b{display:inline-block;padding:6px 18px 4px 12px;background:#fff;color:#140e3a;font:900 15px Archivo,sans-serif;font-stretch:110%;letter-spacing:.04em;clip-path:polygon(0 0,92% 0,100% 100%,0 100%);position:relative}
.hx-plus{width:28px;height:28px;margin-bottom:4px;display:grid;place-items:center;background:#fff;color:#140e3a;font:900 20px/1 Archivo,sans-serif;text-decoration:none;border-radius:3px;transition:transform .15s}.hx-plus:hover{transform:rotate(90deg)}
.hx-sl{display:grid;padding:10px 14px;background:rgba(5,4,20,.55)}.hx-row{display:flex;align-items:baseline;gap:8px;padding:5px 0;font:700 14px Archivo,sans-serif;color:#d9d3ff;animation:hxRow .4s both}.hx-row i{flex:1;border-bottom:1px dotted rgba(255,255,255,.25);transform:translateY(-4px)}.hx-row b{color:#fff;font:900 16px Archivo,sans-serif}@keyframes hxRow{from{opacity:0;transform:translateX(12px)}}
.hx-slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px;background:rgba(5,4,20,.55)}
.hx-slot{position:relative;display:grid;place-items:center;gap:4px;aspect-ratio:1;padding:6px;border-radius:4px;background:linear-gradient(160deg,#8b7bd8,#5b4bb0);box-shadow:inset 0 0 0 3px rgba(255,255,255,.45);text-decoration:none;color:#fff;overflow:hidden;transition:transform .15s}.hx-slot:hover{transform:translateY(-3px)}
.hx-slot .pl{font:300 34px/1 Archivo,sans-serif;color:rgba(255,255,255,.55)}.hx-slot small{position:absolute;bottom:3px;left:0;right:0;text-align:center;font:800 8.5px "JetBrains Mono",monospace;text-transform:uppercase;color:rgba(255,255,255,.75)}
.hx-slot:not(.on){background:#140e3a;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.hx-slot.rar-rara{background:linear-gradient(160deg,#38bdf8,#1e3a8a)}.hx-slot.rar-epica{background:linear-gradient(160deg,#c084fc,#6d28d9)}.hx-slot.rar-legendaria{background:linear-gradient(160deg,#ffd23f,#b45309)}
.hx-slot .cos-prev.mini{min-height:0;width:100%;height:70%;padding:2px;font-size:10px;border-radius:4px;transform:scale(.9)}.hx-slot .cos-prev.mini .tav{--s:clamp(26px,5.5vw,40px)!important}.hx-slot .cos-prev.mini .mpn{max-width:100%;align-items:center}.hx-slot .cos-prev.mini .mpn-t{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:.62em;letter-spacing:.04em}
.hx-act{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.hx-go{border:0;cursor:pointer;padding:14px 34px;background:linear-gradient(180deg,#d9ff6b,#86e000);color:#14210a;font:italic 900 17px Archivo,sans-serif;font-stretch:115%;letter-spacing:.04em;text-decoration:none;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);filter:drop-shadow(0 4px 0 #4a7a00);transition:transform .12s,filter .12s}.hx-go:hover{transform:translateY(-2px);filter:drop-shadow(0 6px 0 #4a7a00) brightness(1.06)}.hx-go:active{transform:translateY(3px);filter:drop-shadow(0 1px 0 #4a7a00)}
