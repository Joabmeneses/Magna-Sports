<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magna Arena · Ranking</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@500;700&display=swap"><link rel="stylesheet" href="site.css">
<style>
body.rkp{background:#0c0a26}
body.rkp:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(45% 35% at 0 0,color-mix(in srgb,var(--ac,#8b5cf6) 40%,transparent),transparent 70%),radial-gradient(40% 35% at 100% 15%,rgba(255,90,54,.2),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(34,211,238,.12),transparent 70%);transition:background .6s}
/* portada */
.rk-h{position:relative;margin-top:24px;border-radius:32px;overflow:hidden;padding:clamp(22px,4.5vw,42px);border:1px solid rgba(255,255,255,.14);background:linear-gradient(125deg,color-mix(in srgb,var(--ac,#8b5cf6) 55%,#14113a),#14113a 60%,#0d2140);isolation:isolate;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.rk-h:before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 26px)}
.rk-h .ey{font:700 12px "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.rk-h h1{margin:6px 0 8px;font:900 clamp(44px,8vw,92px)/1 Archivo,sans-serif;font-stretch:125%;letter-spacing:-.02em;text-transform:uppercase;padding-top:.04em}
.rk-h h1 span{background:linear-gradient(90deg,#fff,color-mix(in srgb,var(--ac,#8b5cf6) 50%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
.rk-h p{margin:0;color:#dcd8f5;max-width:56ch}.rk-dir{display:inline-block;margin-top:14px;color:#fff;font:800 14px Archivo,sans-serif;text-decoration:none;border-bottom:2px solid var(--ac)}
.rk-trophy{font-size:clamp(70px,11vw,130px);line-height:1;filter:drop-shadow(0 14px 30px rgba(0,0,0,.45));animation:rkBob 3.2s ease-in-out infinite;user-select:none}
@keyframes rkBob{50%{transform:translateY(-10px) rotate(-4deg)}}
/* pestañas */
.rk-tabs{position:sticky;top:66px;z-index:20;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:22px -4px 0;padding:10px 4px;background:linear-gradient(180deg,#0c0a26 75%,rgba(12,10,38,0))}
.rk-tabs::-webkit-scrollbar{display:none}
.rk-tab{flex:none;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#e7e6f7;border-radius:999px;padding:10px 16px;font:800 14px Archivo,sans-serif;cursor:pointer;transition:background .2s,transform .15s,border-color .2s}
.rk-tab:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.35)}.rk-tab .e{font-size:17px}.rk-tab small{font:700 11px "JetBrains Mono",monospace;opacity:.7}
.rk-tab.on{background:var(--tc);border-color:var(--tc);color:#0b0a1f;box-shadow:0 10px 26px -10px var(--tc)}
/* mi lugar */
.rk-me{margin-top:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-radius:22px;border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 22%,transparent),rgba(255,255,255,.02));animation:rkIn .45s both}
.rk-me .pos{font:900 34px/1 Archivo,sans-serif;font-stretch:120%;color:var(--ac)}.rk-me .tx{flex:1 1 220px;min-width:0}.rk-me .tx b{display:block;font:800 16px Archivo,sans-serif}.rk-me .tx small{color:#cfcde6;font-size:13px}
.rk-me button{border:0;border-radius:999px;padding:9px 16px;font:800 13px Archivo,sans-serif;cursor:pointer;background:var(--ac);color:#0b0a1f}
/* podio */
.rk-pod{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,18px);align-items:end;margin:30px auto 8px;max-width:900px}
.rk-pc{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;color:inherit;text-decoration:none;min-width:0}
.rk-pc .who{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 4px 12px;min-width:0;max-width:100%;animation:rkDrop .7s cubic-bezier(.2,1.3,.4,1) both}
.rk-pc .ring{position:relative;display:grid;place-items:center}
.rk-pc .ring>.tav,.rk-pc .ring>.cr,.rk-pc .ring>.av{--s:clamp(58px,9vw,84px);width:var(--s);height:var(--s)}
.rk-pc.p1 .ring>.tav,.rk-pc.p1 .ring>.cr,.rk-pc.p1 .ring>.av{--s:clamp(72px,11vw,108px)}
.rk-pc.p1 .ring:before{content:"👑";position:absolute;top:-.95em;left:50%;transform:translateX(-50%) rotate(-10deg);font-size:clamp(26px,4vw,38px);z-index:4;animation:rkCrown 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
@keyframes rkCrown{50%{transform:translateX(-50%) rotate(8deg) translateY(-4px)}}
.rk-pc .ring:after{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,var(--mc) 0,transparent 70%);opacity:.45;z-index:-1;animation:rkGlow 2.6s ease-in-out infinite}
@keyframes rkGlow{50%{opacity:.8;transform:scale(1.08)}}
.rk-pc b.nm{font:900 clamp(14px,1.8vw,19px) Archivo,sans-serif;text-transform:uppercase;font-stretch:112%;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-pc .nm .mpn{align-items:center}
.rk-pc small.sb{color:#c9c7e2;font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-pc .val{font:900 clamp(20px,3vw,32px)/1 Archivo,sans-serif;font-stretch:120%;color:var(--mc);font-variant-numeric:tabular-nums}.rk-pc .val small{display:block;font:600 10px "JetBrains Mono",monospace;letter-spacing:.1em;color:#c9c7e2;text-transform:uppercase;margin-top:4px}
.rk-st{width:100%;border-radius:18px 18px 6px 6px;display:grid;place-items:start center;padding-top:10px;font:900 clamp(34px,6vw,60px)/1 Archivo,sans-serif;font-stretch:125%;color:rgba(255,255,255,.92);text-shadow:0 4px 14px rgba(0,0,0,.35);background:linear-gradient(180deg,var(--mc),color-mix(in srgb,var(--mc) 35%,#0c0a26));box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 20px 40px -18px var(--mc);transform-origin:bottom;animation:rkRise .8s cubic-bezier(.2,1,.3,1) both;position:relative;overflow:hidden}
.rk-st:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);transform:translateX(-120%);animation:rkShine 3.5s 1s ease-in-out infinite}
@keyframes rkShine{60%,100%{transform:translateX(120%)}}
.rk-pc.p1{--mc:#ffc400}.rk-pc.p2{--mc:#cbd5e1}.rk-pc.p3{--mc:#f59e6b}
.rk-pc.p1 .rk-st{height:clamp(110px,16vw,170px)}.rk-pc.p2 .rk-st{height:clamp(80px,11vw,120px)}.rk-pc.p3 .rk-st{height:clamp(60px,8vw,90px)}
.rk-pc:hover .who{transform:translateY(-4px)}.rk-pc .who{transition:transform .2s}
@keyframes rkRise{from{transform:scaleY(0)}}@keyframes rkDrop{from{opacity:0;transform:translateY(-24px) scale(.8)}}@keyframes rkIn{from{opacity:0;transform:translateY(12px)}}
/* herramientas */
.rk-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:26px 0 12px}
.rk-q{flex:1 1 220px;max-width:340px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(10,13,24,.55);color:#fff;padding:11px 16px;font:500 14px Archivo,sans-serif}
.rk-sel{border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(10,13,24,.55);color:#fff;padding:10px 14px;font:600 14px Archivo,sans-serif}
.rk-cmp{margin-left:auto;font-size:13px;color:#cfcde6}.rk-cmp b{color:var(--ac)}.rk-cmp button{margin-left:6px;border:1px solid rgba(255,255,255,.25);background:none;color:#fff;border-radius:999px;padding:5px 10px;cursor:pointer;font:700 12px Archivo,sans-serif}
.rk-leg{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.rk-leg span{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);border-radius:999px;padding:6px 12px;font-size:12px;color:#cfcde6}.rk-leg b{color:#fff}
/* filas */
.rk-list{display:grid;gap:8px}
.rk-r{border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);animation:rkIn .4s both;transition:border-color .2s,background .2s,transform .15s;overflow:hidden}
.rk-r:hover{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.06)}
.rk-r.top1{background:linear-gradient(90deg,rgba(255,196,0,.16),rgba(255,255,255,.03) 60%);border-color:rgba(255,196,0,.4)}.rk-r.top2{background:linear-gradient(90deg,rgba(203,213,225,.12),rgba(255,255,255,.03) 60%)}.rk-r.top3{background:linear-gradient(90deg,rgba(245,158,107,.13),rgba(255,255,255,.03) 60%)}
.rk-r.me{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset,0 0 26px -6px var(--ac)}.rk-r.flash{animation:rkFlash 1.4s ease 2}
@keyframes rkFlash{50%{background:color-mix(in srgb,var(--ac) 30%,transparent)}}
.rk-row{display:grid;grid-template-columns:52px minmax(0,1.7fr) minmax(120px,1fr) auto 28px;gap:14px;align-items:center;padding:10px 14px;cursor:pointer;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left}
.rk-n{display:flex;flex-direction:column;align-items:center;gap:2px}.rk-n b{font:900 22px/1 Archivo,sans-serif;font-stretch:120%;color:#bdbbd6;font-variant-numeric:tabular-nums}.top1 .rk-n b{color:#ffc400}.top2 .rk-n b{color:#e2e8f0}.top3 .rk-n b{color:#f59e6b}
.rk-d{font:700 10px "JetBrains Mono",monospace;padding:1px 5px;border-radius:6px}.rk-d.up{color:#2ee59d;background:rgba(46,229,157,.14)}.rk-d.dn{color:#ff6b7a;background:rgba(255,90,106,.14)}.rk-d.nw{color:#22d3ee;background:rgba(34,211,238,.14)}.rk-d.eq{color:#8f8daa}
.rk-who{display:flex;align-items:center;gap:12px;min-width:0}.rk-who .tav,.rk-who .cr,.rk-who .av{--s:44px;width:44px;height:44px;flex:none}.rk-who>div{min-width:0}.rk-who b{display:block;font:800 16px Archivo,sans-serif;min-width:0}.rk-who b .mpn{max-width:100%}.rk-who small{display:block;color:#a9a7c4;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{border-radius:50%;display:grid;place-items:center;background:#191f3c;border:2px solid rgba(255,255,255,.25);font:900 15px Archivo,sans-serif;color:#cfcde6;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.rk-bar{min-width:0}.rk-bar .t{height:9px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}.rk-bar .t i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 60%,#22d3ee),var(--ac));transition:width 1s cubic-bezier(.2,1,.3,1)}
.rk-bar .tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.rk-bar .tg span{font-size:11px;color:#bdbbd6;border-radius:999px;padding:2px 8px;background:rgba(255,255,255,.06);white-space:nowrap}
.rk-v{text-align:right;font:900 22px/1 Archivo,sans-serif;font-stretch:115%;font-variant-numeric:tabular-nums;white-space:nowrap}.rk-v small{display:block;font:600 10px "JetBrains Mono",monospace;letter-spacing:.08em;color:#a9a7c4;text-transform:uppercase;margin-top:3px}
.rk-chev{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);transition:transform .25s;font-size:12px;color:#cfcde6}.rk-r.open .rk-chev{transform:rotate(180deg)}
.rk-x{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}.rk-r.open .rk-x{grid-template-rows:1fr}.rk-x>div{overflow:hidden}
.rk-xi{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:4px 16px 16px 80px}
.rk-sts{display:flex;flex-wrap:wrap;gap:8px}.rk-sts div{min-width:74px;padding:8px 12px;border-radius:14px;background:rgba(10,13,24,.4);border:1px solid rgba(255,255,255,.08);text-align:center}.rk-sts b{display:block;font:900 18px Archivo,sans-serif}.rk-sts small{font:600 10px "JetBrains Mono",monospace;color:#a9a7c4;letter-spacing:.06em;text-transform:uppercase}
.rk-acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}.rk-acts a,.rk-acts button{border-radius:999px;padding:9px 14px;font:800 13px Archivo,sans-serif;text-decoration:none;cursor:pointer;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff}.rk-acts .pr{background:var(--ac);border-color:var(--ac);color:#0b0a1f}.rk-acts .sel{background:#fff;color:#0b0a1f}
.rk-more{display:block;margin:14px auto 0;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#fff;border-radius:999px;padding:11px 20px;font:800 14px Archivo,sans-serif;cursor:pointer}
.rk-emp{padding:26px;border-radius:22px;border:1px dashed rgba(255,255,255,.2);text-align:center;color:#a9a7c4}
.rk-note{color:#a9a7c4;font-size:13px;margin:18px 0 0;line-height:1.5}
/* confeti */
.rk-cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:80;pointer-events:none;animation:rkFall var(--d,2.4s) cubic-bezier(.25,.6,.4,1) forwards}
@keyframes rkFall{to{transform:translate(var(--x,0),105vh) rotate(var(--r,540deg));opacity:.2}}
/* comparar */
.md h3.cmp-t{font-size:clamp(22px,5vw,30px);padding-right:84px}.cmp-h{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center;margin:6px 0 16px}.cmp-h .s{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}.cmp-h .s b{font:900 17px Archivo,sans-serif;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cmp-h .s .tav,.cmp-h .s .cr{--s:64px;width:64px;height:64px}.cmp-h .vs{font:900 26px Archivo,sans-serif;color:#ff5a36}
.cmp-r{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center;margin:8px 0}.cmp-r .v{font:900 16px Archivo,sans-serif;font-variant-numeric:tabular-nums}.cmp-r .v:first-child{text-align:right}.cmp-r .w{color:#2ee59d}
.cmp-b{position:relative}.cmp-b small{display:block;text-align:center;font:700 10px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#a9a7c4;margin-bottom:4px}.cmp-b .tr{display:grid;grid-template-columns:1fr 1fr;gap:3px;height:10px}.cmp-b .tr span{background:rgba(255,255,255,.07);border-radius:9px;overflow:hidden;display:flex}.cmp-b .tr span:first-child{justify-content:flex-end}.cmp-b .tr i{display:block;height:100%;border-radius:9px;transition:width .9s cubic-bezier(.2,1,.3,1);width:0}.cmp-b .tr span:first-child i{background:linear-gradient(270deg,#8b5cf6,#22d3ee)}.cmp-b .tr span:last-child i{background:linear-gradient(90deg,#ff5a36,#ffc400)}
.cmp-win{text-align:center;margin-top:16px;font:800 15px Archivo,sans-serif}
@media(max-width:760px){.rk-h{grid-template-columns:1fr}.rk-trophy{display:none}.rk-tabs{top:56px}.rk-row{grid-template-columns:40px minmax(0,1fr) auto 22px;gap:10px;padding:10px}.rk-bar{display:none}.rk-xi{padding:4px 12px 14px}.rk-acts{margin-left:0}.rk-who .tav,.rk-who .cr,.rk-who .av{--s:38px;width:38px;height:38px}.rk-v{font-size:18px}.rk-n b{font-size:18px}.rk-cmp{margin-left:0;width:100%}}
@media(max-width:420px){.rk-pc small.sb{display:none}.rk-pc .val small{display:none}}
@media(prefers-reduced-motion:reduce){.rk-trophy,.rk-pc .ring:before,.rk-pc .ring:after,.rk-st,.rk-st:after,.rk-pc .who,.rk-r,.rk-me{animation:none}.rk-cf{display:none}}
</style><link rel="stylesheet" href="arena.css"></head>
<body class="rkp"><header class="top" id="top"></header><script src="nav.js"></script>
<main class="wrap" id="rk"></main>
<script src="data.js"></script><script src="store.js"></script><script src="cos.js"></script><script src="cloud.js" defer></script><script src="accounts.js" defer></script><script src="live.js" defer></script><script src="site.js"></script><script src="arena.js"></script><script src="ranking.js" defer></script></body></html>
