<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a0d18"><link rel="apple-touch-icon" href="img/app/apple-touch.png?v=3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Magna">
<title>Magna Arena · Equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Space+Mono:wght@400;700&family=Archivo+Black&display=swap"><link rel="stylesheet" href="site.css">

<style>
html body.tp{--ink:#0c0716;--coal:#150c28;--card:#1d1236;--line:rgba(255,255,255,.08);--paper:#f4f1ff;--mut:#b3a8d9;--lime:#c6ff1a;--win:#2ee59d;--loss:#ff6f8e;--tc:#8b5cf6;
  background:var(--coal)!important;background-image:none!important;color:var(--paper);font-family:Archivo,system-ui,sans-serif}
html body.tp:before,html body.tp:after{display:none!important}
html body.tp .tp-w{max-width:760px;margin:0 auto;padding:18px 16px 60px}
html body.tp .tp-cv{position:relative;height:190px;border-radius:26px;overflow:hidden;background:radial-gradient(120% 140% at 15% 10%,color-mix(in srgb,var(--tc) 90%,#fff 10%),var(--tc) 35%,color-mix(in srgb,var(--tc) 35%,#0c0716) 100%)}
html body.tp .tp-cv:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-60deg,rgba(255,255,255,.07) 0 2px,transparent 2px 18px)}
html body.tp .tp-cv>.tp-wm{position:absolute;right:-10px;bottom:-26px;font:400 120px/1 "Archivo Black",sans-serif;text-transform:uppercase;color:rgba(255,255,255,.12);white-space:nowrap}
html body.tp .tp-cvb{position:absolute;top:12px;left:12px;right:12px;z-index:2;display:flex;justify-content:space-between}
html body.tp .tp-ib{display:inline-grid;place-items:center;height:38px;min-width:38px;padding:0 12px;border-radius:999px;border:0;background:rgba(12,7,22,.55);backdrop-filter:blur(6px);color:#fff;text-decoration:none;font:700 12px Archivo,sans-serif;cursor:pointer}
html body.tp .tp-ib:hover{background:var(--ink)}
html body.tp .tp-hd{display:flex;align-items:flex-end;gap:16px;margin:-52px 0 0;padding:0 8px;position:relative;z-index:3}
html body.tp .tp-av{flex:none;border-radius:50%;box-shadow:0 0 0 5px var(--coal)}
html body.tp .tp-av>*{width:112px!important;height:112px!important;border-radius:50%!important;font-size:34px!important}
html body.tp .tp-nm{flex:1;min-width:0;padding-bottom:6px}
html body.tp .tp-nm h1{margin:0;font:400 clamp(28px,6vw,40px)/1 "Archivo Black",sans-serif;text-transform:uppercase;overflow-wrap:anywhere;color:#fff}
html body.tp .tp-vf{display:inline-block;width:clamp(22px,4vw,30px);height:clamp(22px,4vw,30px);margin-left:8px;vertical-align:middle}html body.tp .tp-vf svg{display:block;width:100%;height:100%}
html body.tp .tp-nm p{margin:6px 0 0;color:var(--mut);font-size:14px}
html body.tp .tp-fl{flex:none;margin-bottom:8px;padding:11px 20px;border-radius:999px;border:0;background:var(--tc);color:#fff;font:800 14px Archivo,sans-serif;cursor:pointer}
html body.tp .tp-fl.on{background:transparent;box-shadow:inset 0 0 0 2px var(--line);color:var(--paper)}
html body.tp .tp-fl small{display:block;font:600 11px Archivo,sans-serif;opacity:.8}
html body.tp .tp-ms{margin:6px 8px 0;font-size:12px;color:var(--mut);min-height:16px}
html body.tp .tp-st{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
html body.tp .tp-st b{display:block;font:400 22px/1.1 "Archivo Black",sans-serif}
html body.tp .tp-st span{font-size:12px;color:var(--mut)}
html body.tp .tp-hl{display:flex;gap:16px;overflow-x:auto;padding:18px 4px 4px;scrollbar-width:none}
html body.tp .tp-hl::-webkit-scrollbar{display:none}
html body.tp .tp-h{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--paper);text-align:center}
html body.tp .tp-h i{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;font:normal 400 16px "Archivo Black",sans-serif;color:#fff;background:var(--c);box-shadow:0 0 0 2px var(--coal),0 0 0 4px var(--c)}
html body.tp .tp-h.off i{filter:grayscale(.7);opacity:.6}
html body.tp .tp-h b{font:700 11px/1.2 Archivo,sans-serif;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html body.tp .tp-h small{font-size:10px;color:var(--mut);margin-top:-4px}
html body.tp .tp-sc{margin-top:30px}
html body.tp .tp-sh{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 12px}
html body.tp .tp-sh h2{margin:0;font:400 18px "Archivo Black",sans-serif;text-transform:uppercase;letter-spacing:.01em}
html body.tp .tp-sh small{color:var(--mut);font-size:12px}
html body.tp .tp-pl{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 10px;scroll-snap-type:x mandatory;scrollbar-width:thin}
html body.tp .tp-p{flex:none;width:132px;scroll-snap-align:start;padding:14px 10px 12px;border-radius:20px;background:linear-gradient(170deg,color-mix(in srgb,var(--tc) 30%,var(--card)),var(--card) 60%);text-align:center;text-decoration:none;color:var(--paper);position:relative;transition:transform .15s}
html body.tp .tp-p:hover{transform:translateY(-4px)}
html body.tp .tp-pa{display:grid;place-items:center;width:78px;height:78px;margin:0 auto 10px;border-radius:50%;background:var(--ink) center/cover;font:400 22px "Archivo Black",sans-serif;color:var(--tc);overflow:hidden}
html body.tp .tp-pa img{width:100%;height:100%;object-fit:cover}
html body.tp .tp-p b{display:block;font:800 14px Archivo,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html body.tp .tp-p small{display:block;margin-top:2px;font-size:11px;color:var(--mut)}
html body.tp .tp-p em{position:absolute;top:10px;right:10px;min-width:30px;padding:3px 6px;border-radius:999px;background:var(--lime);color:var(--ink);font:400 12px "Archivo Black",sans-serif;font-style:normal}
html body.tp .tp-p.dt{background:var(--card);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tc) 60%,transparent)}
html body.tp .tp-mt{display:flex;flex-direction:column;gap:10px}
html body.tp .tp-m{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:18px;background:var(--card);color:var(--paper);cursor:pointer;text-align:left;font:inherit;transition:background .15s}
html body.tp .tp-m:hover{background:color-mix(in srgb,var(--tc) 18%,var(--card))}
html body.tp .tp-t{display:flex;align-items:center;gap:8px;min-width:0}
html body.tp .tp-t.r{flex-direction:row-reverse;text-align:right}
html body.tp .tp-t b{font:800 14px Archivo,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html body.tp .tp-t>span:first-child,html body.tp .tp-t .cr{flex:none}
html body.tp .tp-sx{text-align:center;min-width:64px}
html body.tp .tp-sx strong{display:block;font:400 22px/1 "Archivo Black",sans-serif}
html body.tp .tp-sx small{display:block;margin-top:3px;font-size:10px;color:var(--mut);white-space:nowrap}
html body.tp .tp-m.w .tp-sx strong{color:var(--win)}html body.tp .tp-m.l .tp-sx strong{color:var(--loss)}
html body.tp .tp-m.lv{box-shadow:inset 0 0 0 2px #ff3b30}
html body.tp .tp-go{font:700 11px Archivo,sans-serif;color:var(--mut);white-space:nowrap}
html body.tp .tp-nx .tp-sx strong{font-size:16px;color:var(--lime)}
html body.tp .tp-more{display:block;margin:12px auto 0;padding:10px 20px;border-radius:999px;border:0;background:var(--card);color:var(--paper);font:700 13px Archivo,sans-serif;cursor:pointer}
html body.tp .tp-gr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
html body.tp .tp-g{padding:14px;border-radius:18px;background:var(--card)}
html body.tp .tp-g b{display:block;font:400 22px/1.1 "Archivo Black",sans-serif}
html body.tp .tp-g span{font-size:12px;color:var(--mut)}
html body.tp .tp-fm{display:flex;gap:6px;margin-top:6px}
html body.tp .tp-fm i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font:normal 800 11px Archivo,sans-serif;color:var(--ink);background:var(--win)}
html body.tp .tp-fm i.l{background:var(--loss)}html body.tp .tp-fm i.e{background:rgba(255,255,255,.1);color:var(--mut)}
html body.tp .tp-cp{display:flex;flex-direction:column;gap:8px;margin-top:10px}
html body.tp .tp-c{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--card);color:var(--paper);text-decoration:none}
html body.tp .tp-c i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
html body.tp .tp-c b{flex:1;min-width:0;font:800 14px Archivo,sans-serif}
html body.tp .tp-c span{font-size:12px;color:var(--mut);white-space:nowrap}
html body.tp .tp-tr{display:flex;flex-wrap:wrap;gap:8px}
html body.tp .tp-tr span{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--card);font:700 13px Archivo,sans-serif}
html body.tp .tp-tr em{font-style:normal;padding:1px 7px;border-radius:999px;background:var(--lime);color:var(--ink);font-size:11px}
html body.tp .tp-e{margin:0;padding:16px;border-radius:18px;background:var(--card);color:var(--mut);font-size:14px;text-align:center}
html body.tp .tp-nf{text-align:center;padding:80px 16px}
@media(max-width:560px){html body.tp .tp-cv{height:150px;border-radius:22px}html body.tp .tp-hd{flex-wrap:wrap;margin-top:-44px}html body.tp .tp-av>*{width:92px!important;height:92px!important}
  html body.tp .tp-nm{flex-basis:calc(100% - 110px)}html body.tp .tp-fl{width:100%;margin:4px 0 0}
  html body.tp .tp-m{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;padding:12px}html body.tp .tp-go{display:none}html body.tp .tp-t b{font-size:13px}
  html body.tp .tp-gr{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mvw{position:fixed;inset:0;z-index:200;display:none}
.mvw.on{display:block}
.mvw-bg{position:absolute;inset:0;background:rgba(8,4,16,.82);backdrop-filter:blur(6px)}
.mvw-in{position:relative;max-width:1180px;margin:2vh auto;height:96vh;display:flex;flex-direction:column;border-radius:24px;overflow:hidden;background:#170d2c;box-shadow:0 0 0 2px var(--tc,#c6ff1a),0 30px 80px rgba(0,0,0,.6);animation:mvIn .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes mvIn{from{opacity:0;transform:translateY(20px) scale(.98)}}
.mvw-h{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0c0716;border-bottom:1px solid rgba(255,255,255,.08)}
.mvw-t{flex:1;min-width:0;text-align:center}.mvw-t b{display:block;font:400 16px/1.2 "Archivo Black",Archivo,sans-serif;text-transform:uppercase;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mvw-t small{font:700 10px "Space Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#b9aee0}
.mvw-ar,.mvw-x{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;font:700 18px/1 Archivo,sans-serif;cursor:pointer}
.mvw-ar:disabled{opacity:.25;cursor:default}.mvw-ar:not(:disabled):hover,.mvw-x:hover{background:var(--tc,#c6ff1a);color:#0c0716;border-color:transparent}
.mvw-f{flex:none;padding:9px 14px;border-radius:999px;background:var(--tc,#c6ff1a);color:#0c0716;text-decoration:none;font:700 11px "Space Mono",monospace;text-transform:uppercase}
.mvw-ld{padding:30px;text-align:center;color:#b9aee0;font:700 12px "Space Mono",monospace}
.mvw-if{display:block;width:100%;border:0;flex:none;background:transparent}
.mvw-in{overflow-y:auto}
@media(max-width:700px){.mvw-in{margin:0;height:100vh;border-radius:0}.mvw-f{display:none}}
</style></head>
